<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover">
  <meta name="description" content="Regardez vos animes en VF et VOSTFR sur Anime & Manga Info - Lecteur vidéo avec épisodes">
  <meta name="theme-color" content="#e94560">
  <title>Visionnage - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    /* Variables */
    :root {
      --primary: #e94560;
      --primary-dark: #c72e48;
      --bg-dark: #0a0a0f;
      --bg-card: #13131f;
      --bg-hover: #1e1e2e;
      --text-light: #f0f0f0;
      --text-muted: #8888aa;
      --border: #252540;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .home-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .home-link:hover {
      color: var(--primary-dark);
    }

    /* Main layout */
    .watch-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
    }

    /* Video section */
    .video-section {
      background: var(--bg-card);
      border-radius: 20px;
      overflow: hidden;
    }

    .video-player-wrapper {
      position: relative;
      background: #000;
      aspect-ratio: 16/9;
    }

    .video-player {
      width: 100%;
      height: 100%;
    }

    .video-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--bg-hover);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Controls */
    .video-controls {
      padding: 1rem;
      border-top: 1px solid var(--border);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .lang-selector, .source-selector, .speed-selector {
      display: flex;
      gap: 0.5rem;
    }

    .lang-btn, .source-btn, .speed-btn {
      padding: 0.4rem 1rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active, .source-btn.active, .speed-btn.active {
      background: var(--primary);
    }

    .episode-nav {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .nav-ep-btn {
      padding: 0.4rem 1rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
    }

    .nav-ep-btn:hover {
      background: var(--primary);
    }

    #currentEpisodeDisplay {
      font-weight: bold;
      color: var(--primary);
    }

    /* Anime info */
    .anime-info {
      padding: 1rem;
    }

    .anime-info h2 {
      margin-bottom: 0.5rem;
    }

    .anime-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 0.8rem 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Episodes section */
    .episodes-section {
      background: var(--bg-card);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .episodes-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .episodes-header h3 {
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #episodeSearch {
      width: 100%;
      padding: 0.6rem 1rem;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: white;
    }

    #episodeSearch::placeholder {
      color: var(--text-muted);
    }

    .episodes-list {
      max-height: 500px;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .episode-card {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem;
      margin-bottom: 0.5rem;
      background: var(--bg-hover);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .episode-card:hover {
      background: #2a2a3a;
      transform: translateX(5px);
    }

    .episode-card.active {
      background: var(--primary);
    }

    .episode-number {
      font-weight: bold;
      min-width: 50px;
    }

    .episode-title {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .episode-date {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .episode-card.active .episode-date {
      color: rgba(255,255,255,0.7);
    }

    .watch-btn {
      background: var(--primary);
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      color: white;
      cursor: pointer;
    }

    /* Toast */
    .toast {
      visibility: hidden;
      min-width: 250px;
      background: var(--bg-card);
      color: white;
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid var(--primary);
    }
    .toast.show {
      visibility: visible;
      animation: fadeInOut 3s ease;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }

    /* Loading */
    .loading, .error {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
    .error { color: var(--primary); }

    /* Responsive */
    @media (max-width: 900px) {
      .watch-container {
        grid-template-columns: 1fr;
      }
      .episodes-section {
        position: static;
      }
    }

    @media (max-width: 600px) {
      .watch-container { padding: 1rem; }
      .controls-row { flex-direction: column; align-items: stretch; }
      .lang-selector, .source-selector, .speed-selector { justify-content: center; }
      .episode-nav { justify-content: center; }
      .episode-title { max-width: 120px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H4a2 2 0 0 1-2-2z"/>
        </svg>
        Accueil
      </a>
      <h1 id="animeTitle">🎬 Lecture</h1>
      <div></div>
    </div>
  </header>

  <main class="watch-container">
    <!-- Section vidéo -->
    <div class="video-section">
      <div class="video-player-wrapper">
        <div class="video-player">
          <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <div id="videoLoading" class="video-loading">
          <div class="spinner"></div>
          <span>Chargement de la vidéo...</span>
        </div>
      </div>
      
      <div class="video-controls">
        <div class="controls-row">
          <div class="lang-selector">
            <button class="lang-btn active" data-lang="vf">🇫🇷 VF</button>
            <button class="lang-btn" data-lang="vostfr">🇯🇵 VOSTFR</button>
          </div>
          <div class="source-selector">
            <button class="source-btn active" data-source="voe">🎬 Voe</button>
            <button class="source-btn" data-source="send">📡 Send</button>
            <button class="source-btn" data-source="gdrive">☁️ Drive</button>
          </div>
          <div class="speed-selector">
            <button class="speed-btn" data-speed="0.75">0.75x</button>
            <button class="speed-btn active" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="1.25">1.25x</button>
            <button class="speed-btn" data-speed="1.5">1.5x</button>
            <button class="speed-btn" data-speed="2">2x</button>
          </div>
        </div>
        <div class="controls-row">
          <div class="episode-nav">
            <button id="prevEpisodeBtn" class="nav-ep-btn">◀ Précédent</button>
            <span id="currentEpisodeDisplay">Épisode 1</span>
            <button id="nextEpisodeBtn" class="nav-ep-btn">Suivant ▶</button>
          </div>
        </div>
      </div>
      
      <div class="anime-info">
        <h2 id="currentAnimeTitle"></h2>
        <div class="anime-meta" id="animeMeta"></div>
      </div>
    </div>

    <!-- Liste des épisodes -->
    <div class="episodes-section">
      <div class="episodes-header">
        <h3>📺 Liste des épisodes</h3>
        <input type="text" id="episodeSearch" placeholder="🔍 Rechercher un épisode...">
      </div>
      <div id="episodesList" class="episodes-list">
        <div class="loading">⏳ Chargement des épisodes...</div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script>
    // ============================================
    // RÉCUPÉRATION DES PARAMÈTRES
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    let currentEpisode = parseInt(urlParams.get('ep')) || 1;
    let currentLang = 'vf';
    let currentSource = 'voe';
    let currentSpeed = 1;
    let episodeCount = 0;
    let animeTitle = '';
    let episodesList = [];

    const API_BASE = 'https://api.jikan.moe/v4';
    const CORS_PROXY = 'https://corsproxy.io/?url=';

    // Corrections du nombre d'épisodes
    const episodeCorrections = {
      21: 1122,  // One Piece
      1: 220,    // Naruto
      2: 500,    // Naruto Shippuden
      3: 366,    // Bleach
      4: 291,    // Dragon Ball Z
      5: 131,    // Dragon Ball Super
      6: 87,     // Attack on Titan
      7: 47,     // Jujutsu Kaisen
      8: 55,     // Demon Slayer
      9: 138,    // My Hero Academia
      10: 293    // Boruto
    };

    // URLs des sources (à remplacer par de vraies sources)
    const embedSources = {
      voe: {
        vf: (id, ep) => `https://voe.sx/e/${id}-${ep}`,
        vostfr: (id, ep) => `https://voe.sx/e/${id}-${ep}`
      },
      send: {
        vf: (id, ep) => `https://send.cm/embed/${id}-${ep}`,
        vostfr: (id, ep) => `https://send.cm/embed/${id}-${ep}`
      },
      gdrive: {
        vf: (id, ep) => `https://drive.google.com/file/d/preview`,
        vostfr: (id, ep) => `https://drive.google.com/file/d/preview`
      }
    };

    // ============================================
    // FETCH AVEC PROXY
    // ============================================
    async function fetchWithProxy(url) {
      try {
        const response = await fetch(url);
        if (response.ok) return response;
      } catch (e) {}
      const proxyUrl = CORS_PROXY + encodeURIComponent(url);
      return fetch(proxyUrl);
    }

    // ============================================
    // CHARGEMENT DE L'ANIME
    // ============================================
    async function loadAnime() {
      if (!animeId) {
        document.getElementById('animeTitle').textContent = 'ID manquant';
        showToast('ID d\'anime manquant', 'error');
        return;
      }

      try {
        const response = await fetchWithProxy(`${API_BASE}/anime/${animeId}`);
        const data = await response.json();
        const anime = data.data;
        
        animeTitle = anime.title;
        episodeCount = episodeCorrections[animeId] || anime.episodes || 24;
        
        document.getElementById('animeTitle').textContent = animeTitle;
        document.getElementById('currentAnimeTitle').textContent = animeTitle;
        
        const isAiring = anime.status === 'Currently Airing';
        document.getElementById('animeMeta').innerHTML = `
          <span>⭐ ${anime.score || 'N/A'}</span>
          <span>📺 ${episodeCount} épisodes</span>
          <span>${isAiring ? '🟢 En cours' : (anime.status === 'Finished Airing' ? '✅ Terminé' : '📅 À venir')}</span>
        `;
        
        generateEpisodesList();
        loadEpisode(currentEpisode);
        
      } catch (error) {
        console.error('Erreur:', error);
        showToast('Erreur de chargement de l\'anime', 'error');
      }
    }

    function generateEpisodesList() {
      episodesList = Array.from({ length: Math.min(episodeCount, 300) }, (_, i) => {
        const epNum = i + 1;
        const releaseDate = new Date();
        releaseDate.setDate(releaseDate.getDate() - (episodeCount - epNum));
        return {
          number: epNum,
          title: `Épisode ${epNum}`,
          releaseDate: releaseDate
        };
      });
      
      displayEpisodesList();
    }

    function displayEpisodesList() {
      const container = document.getElementById('episodesList');
      if (!container) return;

      container.innerHTML = episodesList.map(ep => `
        <div class="episode-card ${ep.number === currentEpisode ? 'active' : ''}" data-ep="${ep.number}">
          <div class="episode-number">Ép. ${ep.number}</div>
          <div class="episode-title">${ep.title}</div>
          <div class="episode-date">📅 ${ep.releaseDate.toLocaleDateString('fr-FR')}</div>
          <button class="watch-btn" data-ep="${ep.number}">▶</button>
        </div>
      `).join('');

      document.querySelectorAll('.episode-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('watch-btn')) return;
          const epNum = parseInt(card.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });

      document.querySelectorAll('.watch-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const epNum = parseInt(btn.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });
    }

    function loadEpisode(episode) {
      currentEpisode = episode;
      const videoFrame = document.getElementById('videoFrame');
      const loadingDiv = document.getElementById('videoLoading');
      
      if (loadingDiv) loadingDiv.style.display = 'flex';
      
      const embedUrl = embedSources[currentSource][currentLang](animeId, episode);
      if (videoFrame) {
        videoFrame.src = embedUrl;
        videoFrame.onload = () => {
          if (loadingDiv) loadingDiv.style.display = 'none';
        };
      }
      
      setTimeout(() => {
        if (loadingDiv) loadingDiv.style.display = 'none';
      }, 3000);
      
      document.getElementById('currentEpisodeDisplay').textContent = `${contentType === 'anime' ? 'Épisode' : 'Chapitre'} ${episode}`;
      
      // Mettre à jour l'URL
      const newUrl = `${window.location.pathname}?id=${animeId}&ep=${episode}`;
      window.history.pushState({}, '', newUrl);
      
      // Mettre à jour l'épisode actif
      document.querySelectorAll('.episode-card').forEach(card => {
        card.classList.remove('active');
        if (parseInt(card.dataset.ep) === episode) {
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
      
      saveProgress(episode);
      showToast(`Lecture: Épisode ${episode}`, 'success');
    }

    function saveProgress(episode) {
      localStorage.setItem(`progress_${animeId}`, episode);
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    function setupEventListeners() {
      // Langue
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLang = btn.dataset.lang;
          loadEpisode(currentEpisode);
        });
      });
      
      // Source
      document.querySelectorAll('.source-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSource = btn.dataset.source;
          loadEpisode(currentEpisode);
        });
      });
      
      // Vitesse
      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSpeed = parseFloat(btn.dataset.speed);
          const videoFrame = document.getElementById('videoFrame');
          if (videoFrame && videoFrame.contentWindow) {
            try {
              videoFrame.contentWindow.postMessage({ type: 'speed', value: currentSpeed }, '*');
            } catch(e) {}
          }
          showToast(`Vitesse: ${currentSpeed}x`, 'info');
        });
      });
      
      // Navigation épisodes
      document.getElementById('prevEpisodeBtn')?.addEventListener('click', () => {
        if (currentEpisode > 1) loadEpisode(currentEpisode - 1);
      });
      
      document.getElementById('nextEpisodeBtn')?.addEventListener('click', () => {
        if (currentEpisode < episodesList.length) loadEpisode(currentEpisode + 1);
      });
      
      // Recherche
      document.getElementById('episodeSearch')?.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        document.querySelectorAll('.episode-card').forEach(card => {
          const epNum = card.dataset.ep;
          if (epNum.includes(searchTerm)) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      });
    }

    function showToast(message, type = 'success') {
      let toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ============================================
    // INITIALISATION
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      loadAnime();
      setupEventListeners();
    });
  </script>
</body>
</html>
