<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Regardez vos animes en VF et VOSTFR sur Anime & Manga Info">
  <meta name="theme-color" content="#e94560">
  <title>Visionnage - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styles supplémentaires pour le lecteur */
    .video-player-wrapper {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
    }
    .video-loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #252540;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .spinner-small {
      width: 20px;
      height: 20px;
      border: 2px solid #252540;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      color: #888;
    }
    .embed-container {
      width: 100%;
      height: 100%;
    }
    .embed-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .hidden {
      display: none !important;
    }
    .toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #1a1a2e;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid #e94560;
    }
    .toast.show {
      visibility: visible;
      animation: fadeInOut 3s ease;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <div class="title-area">
        <span class="content-type-badge" id="contentTypeBadge">🎬 ANIME</span>
        <h1 id="animeTitle">Lecture</h1>
      </div>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">🔵 Google</button>
        <button onclick="loginWithFacebook()" class="facebook-btn">📘 Facebook</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">🚪 Déconnexion</button>
        <a href="profile.html" class="profile-link">👤 Mon profil</a>
      </div>
    </div>
  </header>

  <main class="watch-container">
    <div class="video-section">
      <div class="video-player-wrapper">
        <div class="video-player">
          <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
          <div id="embedContainer" class="embed-container hidden"></div>
          <div id="videoLoadingOverlay" class="video-loading-overlay hidden">
            <div class="spinner"></div>
            <span>Chargement...</span>
          </div>
        </div>
      </div>
      
      <div class="video-controls">
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="vf">🇫🇷 VF</button>
          <button class="lang-btn" data-lang="vostfr">🇯🇵 VOSTFR</button>
        </div>
        <div class="episode-nav">
          <button id="prevEpisodeBtn" class="nav-ep-btn">◀ Précédent</button>
          <span id="currentEpisodeDisplay">Épisode 1</span>
          <button id="nextEpisodeBtn" class="nav-ep-btn">Suivant ▶</button>
        </div>
      </div>
      
      <div class="anime-info">
        <h2 id="currentAnimeTitle"></h2>
        <p id="animeSynopsis"></p>
      </div>
    </div>

    <div class="episodes-section">
      <div class="episodes-header">
        <h3>📺 Liste des épisodes</h3>
        <input type="text" id="episodeSearch" placeholder="Rechercher un épisode...">
      </div>
      <div id="episodesList" class="episodes-grid">
        <div class="loading-state">⏳ Chargement des épisodes...</div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script>
    // ============================================
    // FIREBASE CONFIG (À REMPLACER)
    // ============================================
    const firebaseConfig = {
      apiKey: "VOTRE_API_KEY",
      authDomain: "VOTRE_PROJECT.firebaseapp.com",
      projectId: "VOTRE_PROJECT_ID",
      storageBucket: "VOTRE_PROJECT.appspot.com",
      messagingSenderId: "VOTRE_SENDER_ID",
      appId: "VOTRE_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    let currentUser = null;

    // ============================================
    // RÉCUPÉRATION DE L'ID
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    const mangaId = urlParams.get('manga');
    const webtoonId = urlParams.get('webtoon');
    const contentType = animeId ? 'anime' : (mangaId ? 'manga' : (webtoonId ? 'webtoon' : null));
    const contentId = animeId || mangaId || webtoonId;

    let currentLang = 'vf';
    let currentEpisode = 1;
    let contentData = null;
    let episodesList = [];

    const API_BASE = 'https://api.jikan.moe/v4';

    // ============================================
    // CHARGEMENT DU CONTENU
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM chargé');
      loadContent();
      setupEventListeners();
    });

    async function loadContent() {
      console.log('loadContent - contentType:', contentType, 'contentId:', contentId);
      
      if (!contentId || !contentType) {
        showError('Aucun contenu spécifié');
        return;
      }

      showLoading();

      try {
        const response = await fetch(`${API_BASE}/${contentType}/${contentId}`);
        if (!response.ok) throw new Error('Erreur de chargement');
        const data = await response.json();
        contentData = data.data;
        
        console.log('Contenu chargé:', contentData.title);

        document.getElementById('animeTitle').textContent = contentData.title;
        document.getElementById('currentAnimeTitle').textContent = contentData.title;
        document.getElementById('animeSynopsis').textContent = contentData.synopsis || 'Synopsis non disponible.';
        document.getElementById('contentTypeBadge').textContent = contentType === 'anime' ? '🎬 ANIME' : (contentType === 'manga' ? '📖 MANGA' : '🎨 WEBTOON');

        generateEpisodesList();
        
        if (episodesList.length > 0) {
          loadEpisode(1);
        } else {
          showError('Aucun épisode disponible');
        }

      } catch (error) {
        console.error('Erreur:', error);
        showError('Impossible de charger le contenu. Vérifie ta connexion.');
      }
    }

    function generateEpisodesList() {
      console.log('generateEpisodesList - contentType:', contentType);
      
      if (contentType === 'anime') {
        const episodeCount = contentData.episodes || 24;
        episodesList = Array.from({ length: Math.min(episodeCount, 100) }, (_, i) => ({
          number: i + 1,
          title: `Épisode ${i + 1}`,
          thumbnail: contentData.images?.jpg?.image_url || '',
          vfUrl: `https://voe.sx/e/${contentId}-${i+1}`,
          vostfrUrl: `https://send.cm/embed/${contentId}-${i+1}`
        }));
      } else {
        episodesList = Array.from({ length: 50 }, (_, i) => ({
          number: i + 1,
          title: `${contentType === 'manga' ? 'Chapitre' : 'Chapitre'} ${i + 1}`,
          thumbnail: contentData.images?.jpg?.image_url || '',
          vfUrl: `https://mangadex.org/title/${contentId}/chapter/${i+1}`,
          vostfrUrl: `https://mangadex.org/title/${contentId}/chapter/${i+1}`
        }));
      }

      console.log('Épisodes générés:', episodesList.length);
      displayEpisodesList();
    }

    function displayEpisodesList() {
      const container = document.getElementById('episodesList');
      if (!container) return;

      if (episodesList.length === 0) {
        container.innerHTML = '<div class="error">Aucun épisode disponible</div>';
        return;
      }

      container.innerHTML = episodesList.map(ep => `
        <div class="episode-card ${ep.number === currentEpisode ? 'active' : ''}" data-ep="${ep.number}">
          <div class="episode-thumb">
            <img src="${ep.thumbnail || 'https://via.placeholder.com/100x56?text=Episode'}" alt="Épisode ${ep.number}" onerror="this.src='https://via.placeholder.com/100x56?text=Ep+${ep.number}'">
          </div>
          <div class="episode-info">
            <div class="episode-num">${contentType === 'anime' ? 'Ép.' : 'Ch.'} ${ep.number}</div>
            <div class="episode-title">${ep.title}</div>
          </div>
          <button class="watch-episode-btn" data-ep="${ep.number}">▶ Regarder</button>
        </div>
      `).join('');

      document.querySelectorAll('.episode-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('watch-episode-btn')) return;
          const epNum = parseInt(card.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });

      document.querySelectorAll('.watch-episode-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const epNum = parseInt(btn.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });
    }

    function loadEpisode(episodeNumber) {
      console.log('loadEpisode:', episodeNumber);
      currentEpisode = episodeNumber;
      const episode = episodesList.find(ep => ep.number === episodeNumber);
      if (!episode) return;

      const videoUrl = currentLang === 'vf' ? episode.vfUrl : episode.vostfrUrl;
      const videoFrame = document.getElementById('videoFrame');
      const embedContainer = document.getElementById('embedContainer');
      const loadingOverlay = document.getElementById('videoLoadingOverlay');

      if (loadingOverlay) loadingOverlay.classList.remove('hidden');

      if (contentType === 'anime') {
        videoFrame.style.display = 'block';
        if (embedContainer) embedContainer.classList.add('hidden');
        videoFrame.src = videoUrl;
      } else {
        videoFrame.style.display = 'none';
        if (embedContainer) {
          embedContainer.classList.remove('hidden');
          embedContainer.innerHTML = `<iframe src="${videoUrl}" frameborder="0"></iframe>`;
        }
      }

      setTimeout(() => {
        if (loadingOverlay) loadingOverlay.classList.add('hidden');
      }, 1000);

      document.querySelectorAll('.episode-card').forEach(card => {
        card.classList.remove('active');
        if (parseInt(card.dataset.ep) === episodeNumber) {
          card.classList.add('active');
        }
      });

      document.getElementById('currentEpisodeDisplay').textContent = `${contentType === 'anime' ? 'Épisode' : 'Chapitre'} ${episodeNumber}`;
      
      const activeCard = document.querySelector('.episode-card.active');
      if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function setupEventListeners() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLang = btn.dataset.lang;
          loadEpisode(currentEpisode);
        });
      });

      document.getElementById('prevEpisodeBtn')?.addEventListener('click', () => {
        if (currentEpisode > 1) loadEpisode(currentEpisode - 1);
      });

      document.getElementById('nextEpisodeBtn')?.addEventListener('click', () => {
        if (currentEpisode < episodesList.length) loadEpisode(currentEpisode + 1);
      });

      document.getElementById('episodeSearch')?.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        document.querySelectorAll('.episode-card').forEach(card => {
          const title = card.querySelector('.episode-title')?.textContent.toLowerCase() || '';
          const episodeNum = card.dataset.ep;
          card.style.display = title.includes(searchTerm) || episodeNum?.includes(searchTerm) ? 'flex' : 'none';
        });
      });

      document.getElementById('fullscreenBtn')?.addEventListener('click', () => {
        const videoPlayer = document.querySelector('.video-player');
        if (videoPlayer.requestFullscreen) videoPlayer.requestFullscreen();
      });
    }

    function showLoading() {
      const container = document.getElementById('episodesList');
      if (container) container.innerHTML = '<div class="loading-state">⏳ Chargement des épisodes...</div>';
    }

    function showError(message) {
      console.error('Erreur:', message);
      const container = document.getElementById('episodesList');
      if (container) container.innerHTML = `<div class="error">❌ ${message}</div>`;
      showToast(message, 'error');
    }

    function showToast(message, type = 'success') {
      let toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // Auth simplifiée
    auth.onAuthStateChanged((user) => {
      currentUser = user;
      const authDiv = document.getElementById('authButtons');
      const userDiv = document.getElementById('userMenu');
      if (authDiv && userDiv) {
        if (user) {
          authDiv.style.display = 'none';
          userDiv.style.display = 'flex';
          document.getElementById('userName').textContent = user.displayName || user.email;
          if (user.photoURL) document.getElementById('userAvatar').src = user.photoURL;
        } else {
          authDiv.style.display = 'flex';
          userDiv.style.display = 'none';
        }
      }
    });

    window.loginWithGoogle = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    window.loginWithFacebook = () => auth.signInWithPopup(new firebase.auth.FacebookAuthProvider());
    window.logout = () => auth.signOut();
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visionnage - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .episode-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0;
      max-height: 200px;
      overflow-y: auto;
    }
    .episode-btn {
      padding: 0.5rem 1rem;
      background: #252540;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    .episode-btn.active, .episode-btn:hover {
      background: #e94560;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <h1 id="animeTitle">🎬 Lecture</h1>
    </div>
  </header>

  <main class="watch-container">
    <div class="video-container">
      <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
    
    <div class="anime-info">
      <h2 id="currentAnimeTitle"></h2>
      <div class="lang-selector">
        <button class="lang-btn active" data-lang="vf">🇫🇷 VF</button>
        <button class="lang-btn" data-lang="vostfr">🇯🇵 VOSTFR</button>
      </div>
    </div>
    
    <div>
      <h3>📺 Épisodes</h3>
      <div id="episodeSelector" class="episode-selector"></div>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    let currentEpisode = parseInt(urlParams.get('ep')) || 1;
    let currentLang = 'vf';
    let animeData = null;
    let episodeCount = 24;
    
    const API_BASE = 'https://api.jikan.moe/v4';
    
    async function loadAnime() {
      if (!animeId) {
        document.getElementById('animeTitle').textContent = 'ID manquant';
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/anime/${animeId}`);
        const data = await response.json();
        animeData = data.data;
        episodeCount = animeData.episodes || 24;
        
        document.getElementById('animeTitle').textContent = animeData.title;
        document.getElementById('currentAnimeTitle').textContent = animeData.title;
        
        loadEpisodeSelector();
        loadEpisode(currentEpisode);
        
      } catch (error) {
        console.error('Erreur:', error);
      }
    }
    
    function loadEpisodeSelector() {
      const container = document.getElementById('episodeSelector');
      const episodes = Array.from({ length: Math.min(episodeCount, 100) }, (_, i) => i + 1);
      
      container.innerHTML = episodes.map(ep => `
        <button class="episode-btn ${ep === currentEpisode ? 'active' : ''}" data-ep="${ep}">
          Ép. ${ep}
        </button>
      `).join('');
      
      document.querySelectorAll('.episode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentEpisode = parseInt(btn.dataset.ep);
          loadEpisode(currentEpisode);
          document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    }
    
    function loadEpisode(episode) {
      // Sources d'embed gratuites et fonctionnelles
      const embedUrls = {
        vf: `https://voe.sx/e/${animeId}-${episode}`,
        vostfr: `https://send.cm/embed/${animeId}-${episode}`
      };
      
      const videoFrame = document.getElementById('videoFrame');
      if (videoFrame) {
        videoFrame.src = embedUrls[currentLang];
      }
      
      // Mettre à jour l'URL sans recharger
      const newUrl = `${window.location.pathname}?id=${animeId}&ep=${episode}`;
      window.history.pushState({}, '', newUrl);
    }
    
    // Changement de langue
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
        loadEpisode(currentEpisode);
      });
    });
    
    loadAnime();
  </script>
</body>
</html>
