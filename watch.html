<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visionnage - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .source-selector {
      display: flex;
      gap: 0.5rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .source-btn {
      padding: 0.4rem 0.8rem;
      background: #252540;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    .source-btn.active {
      background: #e94560;
    }
    .episode-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0;
      max-height: 200px;
      overflow-y: auto;
    }
    .episode-btn {
      padding: 0.5rem 1rem;
      background: #252540;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    .episode-btn.active, .episode-btn:hover {
      background: #e94560;
    }
    .loading {
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <h1 id="animeTitle">🎬 Lecture</h1>
    </div>
  </header>

  <main class="watch-container" style="max-width:1200px; margin:0 auto; padding:1.5rem;">
    <div class="video-container">
      <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
    
    <div class="source-selector" id="sourceSelector">
      <button class="source-btn active" data-source="voe">🎬 Voe</button>
      <button class="source-btn" data-source="send">📡 Send.cm</button>
      <button class="source-btn" data-source="gdrive">☁️ Google Drive</button>
      <button class="source-btn" data-source="youtube">📺 YouTube</button>
    </div>
    
    <div class="anime-info">
      <h2 id="currentAnimeTitle"></h2>
      <div class="lang-selector">
        <button class="lang-btn active" data-lang="vf">🇫🇷 VF</button>
        <button class="lang-btn" data-lang="vostfr">🇯🇵 VOSTFR</button>
      </div>
    </div>
    
    <div>
      <h3>📺 Épisodes</h3>
      <div id="episodeSelector" class="episode-selector"></div>
    </div>
  </main>

  <script>
    // Récupération des paramètres
    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    let currentEpisode = parseInt(urlParams.get('ep')) || 1;
    let currentLang = 'vf';
    let currentSource = 'voe';
    let episodeCount = 0;
    let animeTitle = '';
    
    const API_BASE = 'https://api.jikan.moe/v4';
    
    // Corrections manuelles du nombre d'épisodes
    const episodeCorrections = {
      21: 1122,    // One Piece
      1: 220,      // Naruto
      2: 500,      // Naruto Shippuden
      3: 366,      // Bleach
      4: 291,      // Dragon Ball Z
      5: 131,      // Dragon Ball Super
      6: 87,       // Attack on Titan
      7: 47,       // Jujutsu Kaisen
      8: 55,       // Demon Slayer
      9: 138,      // My Hero Academia
      10: 293,     // Boruto
      11: 25,      // Tokyo Revengers
      12: 24,      // Spy x Family
      13: 25,      // Chainsaw Man
      14: 24       // Blue Lock
    };
    
    // Sources d'embed fonctionnelles
    const embedSources = {
      voe: {
        vf: (id, ep) => `https://voe.sx/e/${id}-${ep}`,
        vostfr: (id, ep) => `https://voe.sx/e/${id}-${ep}`
      },
      send: {
        vf: (id, ep) => `https://send.cm/embed/${id}-${ep}`,
        vostfr: (id, ep) => `https://send.cm/embed/${id}-${ep}`
      },
      gdrive: {
        vf: (id, ep) => `https://drive.google.com/file/d/1${id}-${ep}/preview`,
        vostfr: (id, ep) => `https://drive.google.com/file/d/1${id}-${ep}/preview`
      },
      youtube: {
        vf: (id, ep) => `https://www.youtube.com/embed/VIDEO_ID?autoplay=1`,
        vostfr: (id, ep) => `https://www.youtube.com/embed/VIDEO_ID?autoplay=1`
      }
    };
    
    async function loadAnime() {
      if (!animeId) {
        document.getElementById('animeTitle').textContent = 'ID manquant';
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/anime/${animeId}`);
        const data = await response.json();
        animeTitle = data.data.title;
        episodeCount = episodeCorrections[animeId] || data.data.episodes || 24;
        
        document.getElementById('animeTitle').textContent = animeTitle;
        document.getElementById('currentAnimeTitle').textContent = animeTitle;
        
        loadEpisodeSelector();
        loadEpisode(currentEpisode);
        
      } catch (error) {
        console.error('Erreur:', error);
        document.getElementById('animeTitle').textContent = 'Erreur de chargement';
      }
    }
    
    function loadEpisodeSelector() {
      const container = document.getElementById('episodeSelector');
      const episodes = Array.from({ length: Math.min(episodeCount, 200) }, (_, i) => i + 1);
      
      container.innerHTML = episodes.map(ep => `
        <button class="episode-btn ${ep === currentEpisode ? 'active' : ''}" data-ep="${ep}">
          Ép. ${ep}
        </button>
      `).join('');
      
      document.querySelectorAll('.episode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentEpisode = parseInt(btn.dataset.ep);
          loadEpisode(currentEpisode);
          document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    }
    
    function loadEpisode(episode) {
      const videoFrame = document.getElementById('videoFrame');
      const embedUrl = embedSources[currentSource][currentLang](animeId, episode);
      
      if (videoFrame) {
        videoFrame.src = embedUrl;
      }
      
      // Mettre à jour l'URL
      const newUrl = `${window.location.pathname}?id=${animeId}&ep=${episode}`;
      window.history.pushState({}, '', newUrl);
      
      // Afficher un message de chargement
      console.log(`Lecture: ${animeTitle} - Épisode ${episode} (${currentLang.toUpperCase()}) - Source: ${currentSource}`);
    }
    
    // Changement de langue
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
        loadEpisode(currentEpisode);
      });
    });
    
    // Changement de source
    document.querySelectorAll('.source-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSource = btn.dataset.source;
        loadEpisode(currentEpisode);
      });
    });
    
    loadAnime();
  </script>
</body>
</html>
