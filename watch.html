<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Regardez vos animes en VF et VOSTFR avec lecteur intégré - Anime & Manga Info">
  <meta name="theme-color" content="#e94560">
  <title>Visionnage - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ============================================
       STYLES LECTEUR VIDÉO
    ============================================ */
    :root {
      --primary: #e94560;
      --primary-dark: #c72e48;
      --bg-dark: #0a0a0f;
      --bg-card: #13131f;
      --bg-hover: #1e1e2e;
      --text-light: #f0f0f0;
      --text-muted: #8888aa;
      --border: #252540;
      --shadow: 0 8px 20px rgba(0,0,0,0.3);
      --radius: 16px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .home-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .home-link:hover {
      color: var(--primary-dark);
    }

    .watch-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
    }

    .video-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .video-player-wrapper {
      position: relative;
      background: #000;
      aspect-ratio: 16/9;
    }

    .video-player {
      width: 100%;
      height: 100%;
    }

    .video-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid var(--bg-hover);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .video-controls {
      padding: 1rem;
      border-top: 1px solid var(--border);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .lang-selector, .source-selector, .speed-selector {
      display: flex;
      gap: 0.5rem;
    }

    .lang-btn, .source-btn, .speed-btn {
      padding: 0.4rem 1rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active, .source-btn.active, .speed-btn.active {
      background: var(--primary);
    }

    .episode-nav {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .nav-ep-btn {
      padding: 0.4rem 1rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
    }

    .nav-ep-btn:hover {
      background: var(--primary);
    }

    #currentEpisodeDisplay {
      font-weight: bold;
      color: var(--primary);
    }

    .anime-info {
      padding: 1rem;
    }

    .anime-info h2 {
      margin-bottom: 0.5rem;
    }

    .anime-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 0.8rem 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .episodes-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .episodes-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .episodes-header h3 {
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #episodeSearch {
      width: 100%;
      padding: 0.6rem 1rem;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: white;
    }

    .episodes-list {
      max-height: 500px;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .episode-card {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem;
      margin-bottom: 0.5rem;
      background: var(--bg-hover);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .episode-card:hover {
      background: #2a2a3a;
      transform: translateX(5px);
    }

    .episode-card.active {
      background: var(--primary);
    }

    .episode-number {
      font-weight: bold;
      min-width: 50px;
    }

    .episode-title {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .episode-date {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .episode-card.active .episode-date {
      color: rgba(255,255,255,0.7);
    }

    .watch-btn {
      background: var(--primary);
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      color: white;
      cursor: pointer;
    }

    .autoplay-switch {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }

    .info-badge {
      display: inline-block;
      background: var(--bg-hover);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      margin-right: 0.5rem;
    }

    .toast {
      visibility: hidden;
      min-width: 250px;
      background: var(--bg-card);
      color: white;
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid var(--primary);
    }

    .toast.show {
      visibility: visible;
      animation: fadeInOut 3s ease;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }

    .loading, .error {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
    .error { color: var(--primary); }

    @media (max-width: 900px) {
      .watch-container { grid-template-columns: 1fr; }
      .episodes-section { position: static; max-height: 500px; }
    }

    @media (max-width: 600px) {
      .watch-container { padding: 1rem; }
      .controls-row { flex-direction: column; align-items: stretch; }
      .lang-selector, .source-selector, .speed-selector { justify-content: center; }
      .episode-nav { justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <h1 id="animeTitle">🎬 Lecture</h1>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">🔵 Google</button>
        <button onclick="loginWithFacebook()" class="facebook-btn">📘 Facebook</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">🚪 Déconnexion</button>
        <a href="profile.html" class="profile-link">👤 Mon profil</a>
      </div>
    </div>
  </header>

  <main class="watch-container">
    <div class="video-section">
      <div class="video-player-wrapper">
        <div class="video-player">
          <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <div id="videoLoading" class="video-loading">
          <div class="spinner"></div>
          <span>Chargement de la vidéo...</span>
        </div>
      </div>
      
      <div class="video-controls">
        <div class="controls-row">
          <div class="lang-selector">
            <button class="lang-btn active" data-lang="vf">🇫🇷 VF</button>
            <button class="lang-btn" data-lang="vostfr">🇯🇵 VOSTFR</button>
          </div>
          <div class="source-selector">
            <button class="source-btn active" data-source="voe">🎬 Voe</button>
            <button class="source-btn" data-source="send">📡 Send</button>
            <button class="source-btn" data-source="kraken">🐙 Kraken</button>
            <button class="source-btn" data-source="animesama">🍥 AnimeSama</button>
          </div>
          <div class="speed-selector">
            <button class="speed-btn" data-speed="0.75">0.75x</button>
            <button class="speed-btn active" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="1.25">1.25x</button>
            <button class="speed-btn" data-speed="1.5">1.5x</button>
            <button class="speed-btn" data-speed="2">2x</button>
          </div>
        </div>
        <div class="controls-row">
          <div class="episode-nav">
            <button id="prevEpisodeBtn" class="nav-ep-btn">◀ Précédent</button>
            <span id="currentEpisodeDisplay">Épisode 1</span>
            <button id="nextEpisodeBtn" class="nav-ep-btn">Suivant ▶</button>
          </div>
          <div class="autoplay-switch">
            <input type="checkbox" id="autoPlayNext" checked>
            <label for="autoPlayNext">📺 Autoplay suivant</label>
          </div>
        </div>
      </div>
      
      <div class="anime-info">
        <h2 id="currentAnimeTitle"></h2>
        <div class="anime-meta" id="animeMeta"></div>
        <div id="progressInfo" class="info-badge">📊 Progression: Non commencé</div>
      </div>
    </div>

    <div class="episodes-section">
      <div class="episodes-header">
        <h3>📺 Liste des épisodes</h3>
        <input type="text" id="episodeSearch" placeholder="🔍 Rechercher un épisode...">
      </div>
      <div id="episodesList" class="episodes-list">
        <div class="loading">⏳ Chargement des épisodes...</div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    let currentEpisode = parseInt(urlParams.get('ep')) || 1;
    let currentLang = 'vf';
    let currentSource = 'voe';
    let episodeCount = 0;
    let animeTitle = '';
    let episodesList = [];
    let autoPlayNext = true;
    let nextAiringEpisode = null;

    const ANILIST_API = 'https://graphql.anilist.co';

    // Corrections pour les animes très longs
    const LONG_ANIMES = {
      21: 1162,    // One Piece (à jour)
      1: 1100,     // Detective Conan
      2: 500,      // Naruto Shippuden
      3: 366,      // Bleach
      4: 291,      // Dragon Ball Z
      5: 131,      // Dragon Ball Super
      6: 87,       // Attack on Titan
      7: 47,       // Jujutsu Kaisen
      8: 55,       // Demon Slayer
      9: 138,      // My Hero Academia
      10: 293      // Boruto
    };

    // Requête AniList avec nextAiringEpisode
    const ANIME_QUERY = `
      query ($id: Int) {
        Media(id: $id, type: ANIME) {
          id
          title { romaji english }
          coverImage { large }
          episodes
          status
          averageScore
          nextAiringEpisode { episode airingAt }
        }
      }
    `;

    async function fetchAnime(id) {
      try {
        const response = await fetch(ANILIST_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: ANIME_QUERY, variables: { id } })
        });
        const data = await response.json();
        return data.data.Media;
      } catch (error) {
        console.error('Erreur:', error);
        return null;
      }
    }

    // Sources d'embed fonctionnelles
    const embedSources = {
      voe: {
        name: 'Voe',
        vf: (id, ep) => `https://voe.sx/e/${id}-${ep}`,
        vostfr: (id, ep) => `https://voe.sx/e/${id}-${ep}`,
        isAvailable: true
      },
      send: {
        name: 'Send.cm',
        vf: (id, ep) => `https://send.cm/embed/${id}-${ep}`,
        vostfr: (id, ep) => `https://send.cm/embed/${id}-${ep}`,
        isAvailable: true
      },
      kraken: {
        name: 'KrakenFiles',
        vf: (id, ep) => `https://krakenfiles.com/embed/${id}-${ep}`,
        vostfr: (id, ep) => `https://krakenfiles.com/embed/${id}-${ep}`,
        isAvailable: true
      },
      animesama: {
        name: 'AnimeSama',
        vf: (id, ep) => `https://animesama.cc/embed/${id}-${ep}`,
        vostfr: (id, ep) => `https://animesama.cc/embed/${id}-${ep}`,
        isAvailable: true
      }
    };

    // ============================================
    // CHARGEMENT DE L'ANIME
    // ============================================
    async function loadAnime() {
      if (!animeId) {
        document.getElementById('animeTitle').textContent = 'ID manquant';
        showToast('ID d\'anime manquant', 'error');
        return;
      }

      try {
        const anime = await fetchAnime(parseInt(animeId));
        if (!anime) throw new Error('Anime non trouvé');
        
        animeTitle = anime.title?.romaji || anime.title?.english || 'Anime';
        
        // Déterminer le nombre réel d'épisodes
        if (LONG_ANIMES[animeId]) {
          episodeCount = LONG_ANIMES[animeId];
        } else if (anime.episodes) {
          episodeCount = anime.episodes;
        } else if (anime.nextAiringEpisode) {
          episodeCount = anime.nextAiringEpisode.episode - 1;
        } else {
          episodeCount = 24;
        }
        
        nextAiringEpisode = anime.nextAiringEpisode;
        
        document.getElementById('animeTitle').textContent = animeTitle;
        document.getElementById('currentAnimeTitle').textContent = animeTitle;
        
        const isAiring = anime.status === 'RELEASING';
        let nextEpText = '';
        if (isAiring && nextAiringEpisode) {
          const nextDate = new Date(nextAiringEpisode.airingAt * 1000);
          nextEpText = ` | 📺 Prochain: Ép. ${nextAiringEpisode.episode} le ${nextDate.toLocaleDateString('fr-FR')}`;
        }
        
        document.getElementById('animeMeta').innerHTML = `
          <span>⭐ ${(anime.averageScore / 10).toFixed(1) || 'N/A'}</span>
          <span>📺 ${episodeCount} épisodes</span>
          <span>${isAiring ? '🟢 En cours' : (anime.status === 'FINISHED' ? '✅ Terminé' : '📅 À venir')}${nextEpText}</span>
        `;
        
        generateEpisodesList();
        await restoreProgress();
        loadEpisode(currentEpisode);
        
      } catch (error) {
        console.error('Erreur:', error);
        document.getElementById('animeTitle').textContent = 'Erreur de chargement';
        showToast('Erreur de chargement de l\'anime', 'error');
      }
    }

    function generateEpisodesList() {
      const maxEpisodes = Math.min(episodeCount, 2000); // Pas de limite pour One Piece !
      episodesList = Array.from({ length: maxEpisodes }, (_, i) => {
        const epNum = i + 1;
        const releaseDate = new Date();
        releaseDate.setDate(releaseDate.getDate() - (episodeCount - epNum));
        return {
          number: epNum,
          title: `Épisode ${epNum}`,
          date: releaseDate.toLocaleDateString('fr-FR')
        };
      });
      
      displayEpisodesList();
    }

    function displayEpisodesList() {
      const container = document.getElementById('episodesList');
      if (!container) return;

      container.innerHTML = episodesList.map(ep => `
        <div class="episode-card ${ep.number === currentEpisode ? 'active' : ''}" data-ep="${ep.number}">
          <div class="episode-number">Ép. ${ep.number}</div>
          <div class="episode-title">${ep.title}</div>
          <div class="episode-date">📅 ${ep.date}</div>
          <button class="watch-btn" data-ep="${ep.number}">▶</button>
        </div>
      `).join('');

      document.querySelectorAll('.episode-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('watch-btn')) return;
          const epNum = parseInt(card.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });

      document.querySelectorAll('.watch-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const epNum = parseInt(btn.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });
    }

    // ============================================
    // LECTEUR VIDÉO
    // ============================================
    function loadEpisode(episode) {
      currentEpisode = episode;
      const videoFrame = document.getElementById('videoFrame');
      const loadingDiv = document.getElementById('videoLoading');
      
      if (loadingDiv) loadingDiv.style.display = 'flex';
      
      const source = embedSources[currentSource];
      const embedUrl = source[currentLang](animeId, episode);
      
      if (videoFrame) {
        videoFrame.src = embedUrl;
        videoFrame.onload = () => {
          if (loadingDiv) loadingDiv.style.display = 'none';
        };
        videoFrame.onerror = () => {
          if (loadingDiv) loadingDiv.style.display = 'none';
          showToast(`Erreur de chargement (source: ${currentSource})`, 'error');
        };
      }
      
      setTimeout(() => {
        if (loadingDiv) loadingDiv.style.display = 'none';
      }, 5000);
      
      document.getElementById('currentEpisodeDisplay').textContent = `Épisode ${episode}`;
      
      const newUrl = `${window.location.pathname}?id=${animeId}&ep=${episode}`;
      window.history.pushState({}, '', newUrl);
      
      document.querySelectorAll('.episode-card').forEach(card => {
        card.classList.remove('active');
        if (parseInt(card.dataset.ep) === episode) {
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
      
      document.getElementById('progressInfo').innerHTML = `📊 Progression: Épisode ${episode}/${episodeCount}`;
      saveProgress(episode);
    }

    // ============================================
    // PROGRESSION
    // ============================================
    function saveProgress(episode) {
      localStorage.setItem(`progress_${animeId}`, episode);
      if (typeof saveProgressToFirebase !== 'undefined' && currentUser) {
        saveProgressToFirebase('anime', animeId, episode);
      }
    }

    async function restoreProgress() {
      const savedEpisode = localStorage.getItem(`progress_${animeId}`);
      if (savedEpisode && parseInt(savedEpisode) !== currentEpisode) {
        if (confirm(`📌 Reprendre à l'épisode ${savedEpisode} ?`)) {
          currentEpisode = parseInt(savedEpisode);
        }
      }
    }

    function nextEpisode() {
      if (currentEpisode < episodeCount) {
        loadEpisode(currentEpisode + 1);
      } else {
        showToast('🎉 C\'est le dernier épisode disponible', 'info');
      }
    }

    function prevEpisode() {
      if (currentEpisode > 1) {
        loadEpisode(currentEpisode - 1);
      } else {
        showToast('📺 C\'est le premier épisode', 'info');
      }
    }

    // ============================================
    // UI & RACCOURCIS
    // ============================================
    function setupEventListeners() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLang = btn.dataset.lang;
          loadEpisode(currentEpisode);
          showToast(`Langue: ${currentLang === 'vf' ? 'VF' : 'VOSTFR'}`, 'info');
        });
      });
      
      document.querySelectorAll('.source-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSource = btn.dataset.source;
          loadEpisode(currentEpisode);
          showToast(`Source: ${embedSources[currentSource]?.name || currentSource}`, 'info');
        });
      });
      
      document.getElementById('prevEpisodeBtn')?.addEventListener('click', prevEpisode);
      document.getElementById('nextEpisodeBtn')?.addEventListener('click', nextEpisode);
      
      const autoPlayCheckbox = document.getElementById('autoPlayNext');
      if (autoPlayCheckbox) {
        autoPlayCheckbox.addEventListener('change', (e) => {
          autoPlayNext = e.target.checked;
          localStorage.setItem('autoPlayNext', autoPlayNext);
        });
      }
      
      document.getElementById('episodeSearch')?.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        document.querySelectorAll('.episode-card').forEach(card => {
          const epNum = card.dataset.ep;
          card.style.display = epNum.includes(searchTerm) ? 'flex' : 'none';
        });
      });
      
      // Raccourcis clavier
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') prevEpisode();
        if (e.key === 'ArrowRight') nextEpisode();
        if (e.key === 'f' || e.key === 'F') document.querySelector('.video-player')?.requestFullscreen();
      });
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadAnime();
      setupEventListeners();
    });
  </script>
</body>
</html>
