<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Regardez vos animes, lisez vos mangas et webtoons en VF et VOSTFR sur Anime & Manga Info">
  <meta name="theme-color" content="#e94560">
  <title>Visionnage - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H4a2 2 0 0 1-2-2z"/>
        </svg>
        Accueil
      </a>
      <div class="title-area">
        <span class="content-type-badge" id="contentTypeBadge">🎬 ANIME</span>
        <h1 id="animeTitle">Lecture</h1>
      </div>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
        <button onclick="loginWithFacebook()" class="facebook-btn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="white" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.95.93-1.95 1.89v2.26h3.32l-.53 3.49h-2.79V24C19.61 23.1 24 18.1 24 12.07z"/>
          </svg>
          Facebook
        </button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Déconnexion
        </button>
        <a href="profile.html" class="profile-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Mon profil
        </a>
      </div>
    </div>
  </header>

  <main class="watch-container">
    <!-- Section vidéo -->
    <div class="video-section">
      <div class="video-player-wrapper">
        <div class="video-player">
          <iframe id="videoFrame" src="" frameborder="0" allowfullscreen allow="autoplay; fullscreen"></iframe>
          <div id="embedContainer" class="embed-container hidden"></div>
          <div id="videoLoadingOverlay" class="video-loading-overlay hidden">
            <div class="spinner"></div>
            <span>Chargement...</span>
          </div>
        </div>
      </div>
      
      <!-- Contrôles -->
      <div class="video-controls">
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="vf">
            <span>🇫🇷</span> VF
          </button>
          <button class="lang-btn" data-lang="vostfr">
            <span>🇯🇵</span> VOSTFR
          </button>
        </div>
        <div class="episode-nav">
          <button id="prevEpisodeBtn" class="nav-ep-btn" title="Épisode précédent">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Précédent
          </button>
          <span id="currentEpisodeDisplay" class="current-episode">Épisode 1</span>
          <button id="nextEpisodeBtn" class="nav-ep-btn" title="Épisode suivant">
            Suivant
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
        <div class="view-mode">
          <button id="fullscreenBtn" class="fullscreen-btn" title="Plein écran">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Infos anime -->
      <div class="anime-info">
        <div class="anime-info-header">
          <h2 id="currentAnimeTitle"></h2>
          <div class="anime-meta" id="animeMeta"></div>
        </div>
        <div class="anime-synopsis">
          <p id="animeSynopsis"></p>
        </div>
      </div>
    </div>

    <!-- Liste des épisodes -->
    <div class="episodes-section">
      <div class="episodes-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <line x1="8" y1="10" x2="16" y2="10"/>
          </svg>
          Liste des épisodes
        </h3>
        <div class="episodes-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="episodeSearch" placeholder="Rechercher un épisode...">
        </div>
      </div>
      <div id="episodesList" class="episodes-grid">
        <div class="loading-state">
          <div class="spinner-small"></div>
          <span>Chargement des épisodes...</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>© 2025 Anime & Manga Info - Tous droits réservés</p>
      <p>Les liens de visionnage sont fournis à titre informatif</p>
    </div>
  </footer>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="firebase-config.js"></script>
  <script src="watch.js"></script>
</body>
</html>
