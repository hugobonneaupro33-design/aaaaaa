<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visionnage - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <h1 id="animeTitle">🎬 Lecture</h1>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">🔵 Google</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">🚪 Déconnexion</button>
        <a href="profile.html" class="profile-link">👤 Mon profil</a>
      </div>
    </div>
  </header>

  <main class="watch-container">
    <!-- Section vidéo -->
    <div class="video-section">
      <div class="video-player">
        <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
        <div id="embedContainer" style="display: none;"></div>
      </div>
      
      <!-- Contrôles -->
      <div class="video-controls">
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="vf">🇫🇷 VF</button>
          <button class="lang-btn" data-lang="vostfr">🇯🇵 VOSTFR</button>
        </div>
        <div class="episode-nav">
          <button id="prevEpisodeBtn" class="nav-ep-btn">◀ Épisode précédent</button>
          <span id="currentEpisodeDisplay">Épisode 1</span>
          <button id="nextEpisodeBtn" class="nav-ep-btn">Épisode suivant ▶</button>
        </div>
      </div>
      
      <!-- Infos anime -->
      <div class="anime-info">
        <h2 id="currentAnimeTitle"></h2>
        <p id="animeSynopsis"></p>
      </div>
    </div>

    <!-- Liste des épisodes -->
    <div class="episodes-section">
      <div class="episodes-header">
        <h3>📺 Liste des épisodes</h3>
        <div class="episodes-search">
          <input type="text" id="episodeSearch" placeholder="Rechercher un épisode...">
        </div>
      </div>
      <div id="episodesList" class="episodes-grid">
        <div class="loading">⏳ Chargement...</div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="firebase-config.js"></script>
  <script src="watch.js"></script>
</body>
</html>
