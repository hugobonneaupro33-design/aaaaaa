<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Regardez vos animes en VF et VOSTFR sur Anime & Manga Info">
  <meta name="theme-color" content="#e94560">
  <title>Visionnage - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styles complets pour le lecteur */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .home-link {
      color: #e94560;
      text-decoration: none;
      font-weight: bold;
    }

    .title-area {
      text-align: center;
    }

    .content-type-badge {
      background: #e94560;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      display: inline-block;
    }

    #animeTitle {
      font-size: 1.2rem;
      margin-top: 0.3rem;
    }

    /* Auth */
    .auth-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .google-btn, .facebook-btn, .logout-btn {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .google-btn { background: #4285f4; color: white; }
    .facebook-btn { background: #1877f2; color: white; }
    .logout-btn { background: #e94560; color: white; }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #252540;
      padding: 0.4rem 0.8rem;
      border-radius: 30px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Main layout */
    .watch-container {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* Video section */
    .video-section {
      background: #1a1a2e;
      border-radius: 16px;
      overflow: hidden;
    }

    .video-player-wrapper {
      position: relative;
      background: #000;
      aspect-ratio: 16/9;
    }

    .video-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #252540;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Video controls */
    .video-controls {
      padding: 1rem;
      background: #1a1a2e;
      border-top: 1px solid #252540;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .lang-selector {
      display: flex;
      gap: 0.5rem;
    }

    .lang-btn {
      padding: 0.4rem 1rem;
      background: #252540;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: #e94560;
    }

    .quality-selector select,
    .speed-selector select {
      padding: 0.4rem 0.8rem;
      background: #252540;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .episode-nav {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .nav-ep-btn {
      padding: 0.4rem 1rem;
      background: #252540;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .nav-ep-btn:hover {
      background: #e94560;
    }

    #currentEpisodeDisplay {
      font-weight: bold;
      color: #e94560;
    }

    /* Anime info */
    .anime-info {
      padding: 1rem;
      background: #1a1a2e;
      border-top: 1px solid #252540;
    }

    .anime-stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin: 0.8rem 0;
      padding: 0.8rem;
      background: #252540;
      border-radius: 12px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .stat-item .label {
      color: #888;
    }

    .stat-item .value {
      color: #e94560;
      font-weight: bold;
    }

    .synopsis {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #aaa;
      margin-top: 0.8rem;
    }

    /* Episodes section */
    .episodes-section {
      background: #1a1a2e;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 120px);
      position: sticky;
      top: 80px;
    }

    .episodes-header {
      padding: 1rem;
      border-bottom: 1px solid #252540;
    }

    .episodes-header h3 {
      color: #e94560;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #episodeSearch {
      width: 100%;
      padding: 0.6rem;
      background: #252540;
      border: none;
      border-radius: 8px;
      color: white;
    }

    #episodeSearch::placeholder {
      color: #888;
    }

    .episodes-grid {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .episode-card {
      display: flex;
      gap: 0.8rem;
      padding: 0.6rem;
      margin-bottom: 0.5rem;
      background: #252540;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .episode-card:hover {
      background: #3a3a5c;
      transform: translateX(4px);
    }

    .episode-card.active {
      background: #e94560;
    }

    .episode-thumb img {
      width: 100px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
    }

    .episode-info {
      flex: 1;
    }

    .episode-num {
      font-size: 0.75rem;
      color: #e94560;
      font-weight: bold;
    }

    .episode-card.active .episode-num {
      color: white;
    }

    .episode-title {
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .episode-date {
      font-size: 0.65rem;
      color: #888;
      margin-top: 0.2rem;
    }

    .watch-episode-btn {
      padding: 0.3rem 0.8rem;
      background: #e94560;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 0.75rem;
      align-self: center;
    }

    /* Info badges */
    .info-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0.8rem 0;
    }

    .info-badge {
      background: #252540;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* Toast */
    .toast {
      visibility: hidden;
      min-width: 250px;
      background: #1a1a2e;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid #e94560;
    }

    .toast.show {
      visibility: visible;
      animation: fadeInOut 3s ease;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }

    .hidden { display: none !important; }

    /* Responsive */
    @media (max-width: 900px) {
      .watch-container {
        grid-template-columns: 1fr;
      }
      .episodes-section {
        position: static;
        max-height: 500px;
      }
    }

    @media (max-width: 600px) {
      .controls-row {
        flex-direction: column;
        align-items: stretch;
      }
      .episode-thumb img {
        width: 70px;
        height: 40px;
      }
      .episode-title {
        max-width: 100px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <div class="title-area">
        <span class="content-type-badge" id="contentTypeBadge">🎬 ANIME</span>
        <h1 id="animeTitle">Lecture</h1>
      </div>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">🔵 Google</button>
        <button onclick="loginWithFacebook()" class="facebook-btn">📘 Facebook</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">🚪 Déconnexion</button>
        <a href="profile.html" class="profile-link">👤 Mon profil</a>
      </div>
    </div>
  </header>

  <main class="watch-container">
    <!-- Section vidéo -->
    <div class="video-section">
      <div class="video-player-wrapper">
        <div class="video-player">
          <iframe id="videoFrame" src="" frameborder="0" allowfullscreen allow="autoplay; fullscreen"></iframe>
          <div id="embedContainer" class="embed-container hidden"></div>
          <div id="videoLoadingOverlay" class="video-loading-overlay hidden">
            <div class="spinner"></div>
            <span>Chargement de la vidéo...</span>
          </div>
        </div>
      </div>
      
      <!-- Contrôles vidéo -->
      <div class="video-controls">
        <div class="controls-row">
          <div class="lang-selector">
            <button class="lang-btn active" data-lang="vf">🇫🇷 VF</button>
            <button class="lang-btn" data-lang="vostfr">🇯🇵 VOSTFR</button>
          </div>
          <div class="quality-selector">
            <select id="qualitySelect">
              <option value="auto">🔧 Auto</option>
              <option value="1080p">📺 1080p</option>
              <option value="720p">📺 720p</option>
              <option value="480p">📺 480p</option>
            </select>
          </div>
          <div class="speed-selector">
            <select id="speedSelect">
              <option value="0.5">🐢 0.5x</option>
              <option value="0.75">⏩ 0.75x</option>
              <option value="1" selected>▶ 1x</option>
              <option value="1.25">⚡ 1.25x</option>
              <option value="1.5">⚡ 1.5x</option>
              <option value="2">🚀 2x</option>
            </select>
          </div>
          <div class="episode-nav">
            <button id="prevEpisodeBtn" class="nav-ep-btn">◀ Précédent</button>
            <span id="currentEpisodeDisplay">Épisode 1</span>
            <button id="nextEpisodeBtn" class="nav-ep-btn">Suivant ▶</button>
          </div>
        </div>
      </div>
      
      <!-- Informations anime -->
      <div class="anime-info">
        <h2 id="currentAnimeTitle"></h2>
        
        <!-- Badges d'information -->
        <div class="info-badges" id="infoBadges">
          <div class="info-badge">⭐ <span id="animeScore">N/A</span></div>
          <div class="info-badge">📊 <span id="animeRank">N/A</span></div>
          <div class="info-badge">👁️ <span id="animeViews">N/A</span> vues</div>
          <div class="info-badge">❤️ <span id="animeFavorites">N/A</span></div>
        </div>
        
        <!-- Statistiques détaillées -->
        <div class="anime-stats">
          <div class="stat-item">
            <span class="label">📅 Date diffusion JAP:</span>
            <span class="value" id="airedDate">N/A</span>
          </div>
          <div class="stat-item">
            <span class="label">🇫🇷 Date diffusion FR:</span>
            <span class="value" id="frDate">N/A</span>
          </div>
          <div class="stat-item">
            <span class="label">📺 Épisodes:</span>
            <span class="value" id="episodeCount">N/A</span>
          </div>
          <div class="stat-item">
            <span class="label">⏱️ Durée:</span>
            <span class="value" id="duration">N/A</span>
          </div>
          <div class="stat-item">
            <span class="label">🏷️ Statut:</span>
            <span class="value" id="status">N/A</span>
          </div>
          <div class="stat-item">
            <span class="label">🎬 Studio:</span>
            <span class="value" id="studio">N/A</span>
          </div>
        </div>
        
        <!-- Genres -->
        <div class="genres-list" id="genresList"></div>
        
        <!-- Synopsis -->
        <div class="synopsis" id="animeSynopsis"></div>
      </div>
    </div>

    <!-- Liste des épisodes -->
    <div class="episodes-section">
      <div class="episodes-header">
        <h3>📺 Liste des épisodes</h3>
        <input type="text" id="episodeSearch" placeholder="🔍 Rechercher un épisode...">
      </div>
      <div id="episodesList" class="episodes-grid">
        <div class="loading-state" style="text-align:center; padding:2rem;">⏳ Chargement des épisodes...</div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script>
    // ============================================
    // FIREBASE CONFIG (à remplacer)
    // ============================================
    const firebaseConfig = {
      apiKey: "VOTRE_API_KEY",
      authDomain: "VOTRE_PROJECT.firebaseapp.com",
      projectId: "VOTRE_PROJECT_ID",
      storageBucket: "VOTRE_PROJECT.appspot.com",
      messagingSenderId: "VOTRE_SENDER_ID",
      appId: "VOTRE_APP_ID"
    };

    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = typeof firebase !== 'undefined' ? firebase.auth() : null;
    let currentUser = null;

    // ============================================
    // RÉCUPÉRATION DES PARAMÈTRES
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    const mangaId = urlParams.get('manga');
    const webtoonId = urlParams.get('webtoon');
    const contentType = animeId ? 'anime' : (mangaId ? 'manga' : (webtoonId ? 'webtoon' : null));
    const contentId = animeId || mangaId || webtoonId;
    let currentEpisode = parseInt(urlParams.get('ep')) || 1;
    let currentLang = 'vf';
    let currentQuality = 'auto';
    let currentSpeed = 1;
    let contentData = null;
    let episodesList = [];

    const API_BASE = 'https://api.jikan.moe/v4';

    // ============================================
    // CHARGEMENT PRINCIPAL
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM chargé - Lecture en cours');
      loadContent();
      setupEventListeners();
    });

    async function loadContent() {
      if (!contentId || !contentType) {
        showError('Aucun contenu spécifié');
        return;
      }

      showLoading();

      try {
        const response = await fetch(`${API_BASE}/${contentType}/${contentId}`);
        if (!response.ok) throw new Error('Erreur de chargement');
        const data = await response.json();
        contentData = data.data;
        
        console.log('Contenu chargé:', contentData.title);

        // Mettre à jour les titres
        document.getElementById('animeTitle').textContent = contentData.title;
        document.getElementById('currentAnimeTitle').textContent = contentData.title;
        document.getElementById('animeSynopsis').innerHTML = contentData.synopsis || 'Synopsis non disponible.';
        
        // Badge type
        const typeNames = { anime: '🎬 ANIME', manga: '📖 MANGA', webtoon: '🎨 WEBTOON' };
        document.getElementById('contentTypeBadge').textContent = typeNames[contentType] || 'ANIME';
        
        // Statistiques
        document.getElementById('animeScore').textContent = contentData.score || 'N/A';
        document.getElementById('animeRank').textContent = contentData.rank ? `#${contentData.rank}` : 'N/A';
        document.getElementById('animeFavorites').textContent = contentData.favorites?.toLocaleString() || '0';
        document.getElementById('episodeCount').textContent = contentData.episodes || '?';
        document.getElementById('duration').textContent = contentData.duration || 'N/A';
        document.getElementById('status').textContent = contentData.status || 'N/A';
        document.getElementById('studio').textContent = contentData.studios?.map(s => s.name).join(', ') || 'N/A';
        
        // Dates
        if (contentData.aired?.from) {
          const jpDate = new Date(contentData.aired.from).toLocaleDateString('fr-FR');
          document.getElementById('airedDate').textContent = jpDate;
        }
        document.getElementById('frDate').textContent = 'À venir';
        
        // Genres
        const genresList = document.getElementById('genresList');
        if (contentData.genres) {
          genresList.innerHTML = contentData.genres.map(g => 
            `<span class="genre-tag">${g.name}</span>`
          ).join('');
        }
        
        // Nombre de vues simulé (basé sur le score et favoris)
        const viewsCount = Math.floor((contentData.score || 7) * 10000 + (contentData.favorites || 0) * 100);
        document.getElementById('animeViews').textContent = viewsCount.toLocaleString();
        
        // Générer la liste des épisodes
        generateEpisodesList();
        
        if (episodesList.length > 0) {
          loadEpisode(currentEpisode);
        } else {
          showError('Aucun épisode disponible');
        }

      } catch (error) {
        console.error('Erreur:', error);
        showError('Impossible de charger le contenu. Vérifie ta connexion.');
      }
    }

    function generateEpisodesList() {
      let episodeCount = 24;
      
      if (contentType === 'anime') {
        episodeCount = contentData.episodes || 24;
        episodesList = Array.from({ length: Math.min(episodeCount, 200) }, (_, i) => {
          const epNum = i + 1;
          // Simulation de dates de sortie (pour l'affichage)
          const releaseDate = new Date();
          releaseDate.setDate(releaseDate.getDate() - (episodeCount - epNum));
          return {
            number: epNum,
            title: `Épisode ${epNum}`,
            thumbnail: contentData.images?.jpg?.image_url || '',
            vfUrl: `https://voe.sx/e/${contentId}-${epNum}`,
            vostfrUrl: `https://send.cm/embed/${contentId}-${epNum}`,
            releaseDate: releaseDate,
            views: Math.floor(Math.random() * 50000) + 1000
          };
        });
      } else {
        episodesList = Array.from({ length: 50 }, (_, i) => ({
          number: i + 1,
          title: `Chapitre ${i + 1}`,
          thumbnail: contentData.images?.jpg?.image_url || '',
          vfUrl: `https://mangadex.org/title/${contentId}/chapter/${i+1}`,
          vostfrUrl: `https://mangadex.org/title/${contentId}/chapter/${i+1}`,
          releaseDate: new Date(),
          views: Math.floor(Math.random() * 10000) + 500
        }));
      }

      console.log('Épisodes générés:', episodesList.length);
      displayEpisodesList();
    }

    function displayEpisodesList() {
      const container = document.getElementById('episodesList');
      if (!container) return;

      if (episodesList.length === 0) {
        container.innerHTML = '<div class="error">Aucun épisode disponible</div>';
        return;
      }

      container.innerHTML = episodesList.map(ep => `
        <div class="episode-card ${ep.number === currentEpisode ? 'active' : ''}" data-ep="${ep.number}">
          <div class="episode-thumb">
            <img src="${ep.thumbnail || 'https://via.placeholder.com/100x56?text=Episode'}" alt="Épisode ${ep.number}" onerror="this.src='https://via.placeholder.com/100x56?text=Ep+${ep.number}'">
          </div>
          <div class="episode-info">
            <div class="episode-num">${contentType === 'anime' ? 'Ép.' : 'Ch.'} ${ep.number}</div>
            <div class="episode-title">${ep.title}</div>
            <div class="episode-date">📅 ${ep.releaseDate.toLocaleDateString('fr-FR')}</div>
          </div>
          <button class="watch-episode-btn" data-ep="${ep.number}">▶ Regarder</button>
        </div>
      `).join('');

      // Événements
      document.querySelectorAll('.episode-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('watch-episode-btn')) return;
          const epNum = parseInt(card.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });

      document.querySelectorAll('.watch-episode-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const epNum = parseInt(btn.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });
    }

    function loadEpisode(episodeNumber) {
      console.log('loadEpisode:', episodeNumber);
      currentEpisode = episodeNumber;
      const episode = episodesList.find(ep => ep.number === episodeNumber);
      if (!episode) return;

      const videoUrl = currentLang === 'vf' ? episode.vfUrl : episode.vostfrUrl;
      const videoFrame = document.getElementById('videoFrame');
      const loadingOverlay = document.getElementById('videoLoadingOverlay');

      if (loadingOverlay) loadingOverlay.classList.remove('hidden');

      if (contentType === 'anime') {
        videoFrame.style.display = 'block';
        videoFrame.src = videoUrl;
      }

      setTimeout(() => {
        if (loadingOverlay) loadingOverlay.classList.add('hidden');
      }, 1000);

      // Mettre à jour l'affichage
      document.querySelectorAll('.episode-card').forEach(card => {
        card.classList.remove('active');
        if (parseInt(card.dataset.ep) === episodeNumber) {
          card.classList.add('active');
        }
      });

      document.getElementById('currentEpisodeDisplay').textContent = `${contentType === 'anime' ? 'Épisode' : 'Chapitre'} ${episodeNumber}`;
      
      const activeCard = document.querySelector('.episode-card.active');
      if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      
      // Sauvegarder la progression
      saveProgress(episodeNumber);
    }

    function saveProgress(episode) {
      if (currentUser) {
        localStorage.setItem(`progress_${contentId}`, episode);
        console.log('Progression sauvegardée:', episode);
      }
    }

    function setupEventListeners() {
      // Langue
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLang = btn.dataset.lang;
          loadEpisode(currentEpisode);
        });
      });
      
      // Qualité
      const qualitySelect = document.getElementById('qualitySelect');
      if (qualitySelect) {
        qualitySelect.addEventListener('change', (e) => {
          currentQuality = e.target.value;
          showToast(`Qualité: ${currentQuality}`, 'info');
        });
      }
      
      // Vitesse
      const speedSelect = document.getElementById('speedSelect');
      if (speedSelect) {
        speedSelect.addEventListener('change', (e) => {
          currentSpeed = parseFloat(e.target.value);
          const videoFrame = document.getElementById('videoFrame');
          if (videoFrame && videoFrame.contentWindow) {
            // Tentative d'application de la vitesse (fonctionne sur certains lecteurs)
            try {
              videoFrame.contentWindow.postMessage({ type: 'speed', value: currentSpeed }, '*');
            } catch(e) {}
          }
          showToast(`Vitesse: ${currentSpeed}x`, 'info');
        });
      }
      
      // Navigation épisodes
      document.getElementById('prevEpisodeBtn')?.addEventListener('click', () => {
        if (currentEpisode > 1) loadEpisode(currentEpisode - 1);
      });

      document.getElementById('nextEpisodeBtn')?.addEventListener('click', () => {
        if (currentEpisode < episodesList.length) loadEpisode(currentEpisode + 1);
      });

      // Recherche
      document.getElementById('episodeSearch')?.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        document.querySelectorAll('.episode-card').forEach(card => {
          const title = card.querySelector('.episode-title')?.textContent.toLowerCase() || '';
          const episodeNum = card.dataset.ep;
          card.style.display = title.includes(searchTerm) || episodeNum?.includes(searchTerm) ? 'flex' : 'none';
        });
      });
    }

    function showLoading() {
      const container = document.getElementById('episodesList');
      if (container) container.innerHTML = '<div class="loading-state" style="text-align:center; padding:2rem;">⏳ Chargement des épisodes...</div>';
    }

    function showError(message) {
      console.error('Erreur:', message);
      const container = document.getElementById('episodesList');
      if (container) container.innerHTML = `<div class="error" style="text-align:center; padding:2rem; color:#e94560;">❌ ${message}</div>`;
      showToast(message, 'error');
    }

    function showToast(message, type = 'success') {
      let toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Authentification
    if (auth) {
      auth.onAuthStateChanged((user) => {
        currentUser = user;
        const authDiv = document.getElementById('authButtons');
        const userDiv = document.getElementById('userMenu');
        if (authDiv && userDiv) {
          if (user) {
            authDiv.style.display = 'none';
            userDiv.style.display = 'flex';
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');
            if (userName) userName.textContent = user.displayName || user.email;
            if (userAvatar && user.photoURL) userAvatar.src = user.photoURL;
            
            // Restaurer la progression
            const savedProgress = localStorage.getItem(`progress_${contentId}`);
            if (savedProgress && parseInt(savedProgress) !== currentEpisode) {
              showToast(`Reprise où vous vous êtes arrêté: Épisode ${savedProgress}`, 'info');
            }
          } else {
            authDiv.style.display = 'flex';
            userDiv.style.display = 'none';
          }
        }
      });
    }

    window.loginWithGoogle = () => auth?.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    window.loginWithFacebook = () => auth?.signInWithPopup(new firebase.auth.FacebookAuthProvider());
    window.logout = () => auth?.signOut();
  </script>
</body>
</html>
