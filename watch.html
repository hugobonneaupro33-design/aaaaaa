<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Regardez vos animes en VF et VOSTFR avec lecteur intégré - Akrya Anime">
  <meta name="theme-color" content="#e94560">
  <title>Visionnage - Akrya Anime</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ============================================
       STYLES LECTEUR VIDÉO
    ============================================ */
    :root {
      --primary: #e94560;
      --primary-dark: #c72e48;
      --bg-dark: #0a0a0f;
      --bg-card: #13131f;
      --bg-hover: #1e1e2e;
      --text-light: #f0f0f0;
      --text-muted: #8888aa;
      --border: #252540;
      --shadow: 0 8px 20px rgba(0,0,0,0.3);
      --radius: 16px;
      --radius-sm: 8px;
    }

    /* ============================================
       THEME CLAIR
    ============================================ */
    body.light-theme {
      --bg-dark: #f5f5f5;
      --bg-card: #ffffff;
      --bg-hover: #e8e8e8;
      --text-light: #1a1a2e;
      --text-muted: #666666;
      --border: #dddddd;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    body.light-theme header {
      background: linear-gradient(135deg, #e8e8e8 0%, #ffffff 100%);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .home-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Boutons thème et zoom */
    .tools-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .theme-btn, .zoom-btn {
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      color: var(--text-light);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .theme-btn:hover, .zoom-btn:hover {
      background: var(--primary);
    }

    .watch-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
    }

    .video-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .video-player-wrapper {
      position: relative;
      background: #000;
      aspect-ratio: 16/9;
      overflow: hidden;
    }

    .video-player {
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease;
      transform-origin: center;
    }

    .video-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .zoom-controls {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: flex;
      gap: 0.5rem;
      z-index: 20;
      background: rgba(0,0,0,0.6);
      padding: 0.3rem 0.6rem;
      border-radius: 30px;
    }
    .zoom-controls button {
      background: var(--bg-hover);
      border: none;
      border-radius: 20px;
      padding: 0.2rem 0.6rem;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .video-loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid var(--bg-hover);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .video-controls {
      padding: 1rem;
      border-top: 1px solid var(--border);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .lang-selector, .source-selector, .speed-selector {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .lang-btn, .source-btn, .speed-btn {
      padding: 0.4rem 1rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active, .source-btn.active, .speed-btn.active {
      background: var(--primary);
    }

    .episode-nav {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .nav-ep-btn {
      padding: 0.4rem 1rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: var(--text-light);
      cursor: pointer;
    }

    .nav-ep-btn:hover {
      background: var(--primary);
    }

    #currentEpisodeDisplay {
      font-weight: bold;
      color: var(--primary);
    }

    .anime-info {
      padding: 1rem;
    }

    .anime-info h2 {
      margin-bottom: 0.5rem;
    }

    .anime-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 0.8rem 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .episodes-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .episodes-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .episodes-header h3 {
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #episodeSearch {
      width: 100%;
      padding: 0.6rem 1rem;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: var(--text-light);
    }

    .episodes-list {
      max-height: 500px;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .episode-card {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem;
      margin-bottom: 0.5rem;
      background: var(--bg-hover);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .episode-card:hover {
      background: #2a2a3a;
      transform: translateX(5px);
    }

    body.light-theme .episode-card:hover {
      background: #d0d0d0;
    }

    .episode-card.active {
      background: var(--primary);
    }

    .episode-number {
      font-weight: bold;
      min-width: 50px;
    }

    .episode-title {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .episode-date {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .episode-card.active .episode-date {
      color: rgba(255,255,255,0.7);
    }

    .watch-btn {
      background: var(--primary);
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      color: white;
      cursor: pointer;
    }

    .autoplay-switch {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }

    .info-badge {
      display: inline-block;
      background: var(--bg-hover);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      margin-right: 0.5rem;
    }

    .toast {
      visibility: hidden;
      min-width: 250px;
      background: var(--bg-card);
      color: var(--text-light);
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid var(--primary);
    }

    .toast.show {
      visibility: visible;
      animation: fadeInOut 3s ease;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }

    .loading, .error {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
    .error { color: var(--primary); }

    @media (max-width: 900px) {
      .watch-container { grid-template-columns: 1fr; }
      .episodes-section { position: static; max-height: 500px; }
    }

    @media (max-width: 600px) {
      .watch-container { padding: 1rem; }
      .controls-row { flex-direction: column; align-items: stretch; }
      .lang-selector, .source-selector, .speed-selector { justify-content: center; }
      .episode-nav { justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <h1 id="animeTitle">🎬 Lecture</h1>
      <div class="tools-bar">
        <button id="themeToggle" class="theme-btn">🌙</button>
        <button id="zoomOutBtn" class="zoom-btn" title="Zoom arrière">−</button>
        <span id="zoomLevel" style="font-size:0.8rem;">100%</span>
        <button id="zoomInBtn" class="zoom-btn" title="Zoom avant">+</button>
        <button id="zoomResetBtn" class="zoom-btn" title="Réinitialiser">↺</button>
      </div>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">🔵 Google</button>
        <button onclick="loginWithFacebook()" class="facebook-btn">📘 Facebook</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">🚪 Déconnexion</button>
        <a href="profile.html" class="profile-link">👤 Mon profil</a>
      </div>
    </div>
  </header>

  <main class="watch-container">
    <div class="video-section">
      <div class="video-player-wrapper">
        <div class="video-player" id="videoPlayer">
          <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="zoom-controls">
          <button id="zoomOutMini" title="Zoom arrière">−</button>
          <button id="zoomResetMini" title="Réinitialiser">↺</button>
          <button id="zoomInMini" title="Zoom avant">+</button>
        </div>
        <div id="videoLoading" class="video-loading">
          <div class="spinner"></div>
          <span>Chargement de la vidéo...</span>
        </div>
      </div>
      
      <div class="video-controls">
        <div class="controls-row">
          <div class="lang-selector">
            <button class="lang-btn active" data-lang="vf">🇫🇷 VF</button>
            <button class="lang-btn" data-lang="vostfr">🇯🇵 VOSTFR</button>
          </div>
          <div class="source-selector" id="sourceSelector"></div>
          <div class="speed-selector">
            <button class="speed-btn" data-speed="0.5">0.5x</button>
            <button class="speed-btn" data-speed="0.75">0.75x</button>
            <button class="speed-btn active" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="1.25">1.25x</button>
            <button class="speed-btn" data-speed="1.5">1.5x</button>
            <button class="speed-btn" data-speed="2">2x</button>
          </div>
        </div>
        <div class="controls-row">
          <div class="episode-nav">
            <button id="prevEpisodeBtn" class="nav-ep-btn">◀ Précédent</button>
            <span id="currentEpisodeDisplay">Épisode 1</span>
            <button id="nextEpisodeBtn" class="nav-ep-btn">Suivant ▶</button>
          </div>
          <div class="autoplay-switch">
            <input type="checkbox" id="autoPlayNext" checked>
            <label for="autoPlayNext">📺 Autoplay suivant</label>
          </div>
        </div>
      </div>
      
      <div class="anime-info">
        <h2 id="currentAnimeTitle"></h2>
        <div class="anime-meta" id="animeMeta"></div>
        <div id="progressInfo" class="info-badge">📊 Progression: Non commencé</div>
      </div>
    </div>

    <div class="episodes-section">
      <div class="episodes-header">
        <h3>📺 Liste des épisodes</h3>
        <input type="text" id="episodeSearch" placeholder="🔍 Rechercher un épisode...">
      </div>
      <div id="episodesList" class="episodes-list">
        <div class="loading">⏳ Chargement des épisodes...</div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    let currentEpisode = parseInt(urlParams.get('ep')) || 1;
    let currentLang = 'vf';
    let currentSource = 'voe';
    let episodeCount = 0;
    let animeTitle = '';
    let episodesList = [];
    let autoPlayNext = true;
    let nextAiringEpisode = null;
    let currentZoom = 1;

    const ANILIST_API = 'https://graphql.anilist.co';
    const PROXY = 'https://corsproxy.io/?url=';

    // ============================================
    // 15 SOURCES DE LECTEUR
    // ============================================
    const embedSources = {
      voe: { name: '🎬 Voe', vf: (id,ep) => `https://voe.sx/e/${id}-${ep}`, vostfr: (id,ep) => `https://voe.sx/e/${id}-${ep}`, isAvailable: true },
      send: { name: '📡 Send', vf: (id,ep) => `https://send.cm/embed/${id}-${ep}`, vostfr: (id,ep) => `https://send.cm/embed/${id}-${ep}`, isAvailable: true },
      kraken: { name: '🐙 Kraken', vf: (id,ep) => `https://krakenfiles.com/embed/${id}-${ep}`, vostfr: (id,ep) => `https://krakenfiles.com/embed/${id}-${ep}`, isAvailable: true },
      animesama: { name: '🍥 AnimeSama', vf: (id,ep) => `https://animesama.cc/embed/${id}-${ep}`, vostfr: (id,ep) => `https://animesama.cc/embed/${id}-${ep}`, isAvailable: true },
      gdrive: { name: '☁️ GDrive', vf: (id,ep) => `https://drive.google.com/file/d/preview`, vostfr: (id,ep) => `https://drive.google.com/file/d/preview`, isAvailable: true },
      uqload: { name: '📤 Uqload', vf: (id,ep) => `https://uqload.com/embed-${id}-${ep}.html`, vostfr: (id,ep) => `https://uqload.com/embed-${id}-${ep}.html`, isAvailable: true },
      streamsb: { name: '🎥 StreamSB', vf: (id,ep) => `https://streamsb.net/embed-${id}-${ep}`, vostfr: (id,ep) => `https://streamsb.net/embed-${id}-${ep}`, isAvailable: true },
      mp4upload: { name: '📀 Mp4Upload', vf: (id,ep) => `https://www.mp4upload.com/embed-${id}-${ep}.html`, vostfr: (id,ep) => `https://www.mp4upload.com/embed-${id}-${ep}.html`, isAvailable: true },
      doodstream: { name: '🎞️ Doodstream', vf: (id,ep) => `https://doodstream.com/e/${id}-${ep}`, vostfr: (id,ep) => `https://doodstream.com/e/${id}-${ep}`, isAvailable: true },
      mixdrop: { name: '🎬 Mixdrop', vf: (id,ep) => `https://mixdrop.co/e/${id}-${ep}`, vostfr: (id,ep) => `https://mixdrop.co/e/${id}-${ep}`, isAvailable: true },
      wolfstream: { name: '🐺 WolfStream', vf: (id,ep) => `https://wolfstream.tv/embed-${id}-${ep}`, vostfr: (id,ep) => `https://wolfstream.tv/embed-${id}-${ep}`, isAvailable: true },
      vidcloud: { name: '☁️ VidCloud', vf: (id,ep) => `https://vidcloud.icu/embed-${id}-${ep}`, vostfr: (id,ep) => `https://vidcloud.icu/embed-${id}-${ep}`, isAvailable: true },
      gogoplay: { name: '🎮 GogoPlay', vf: (id,ep) => `https://gogoplay.io/embed/${id}-${ep}`, vostfr: (id,ep) => `https://gogoplay.io/embed/${id}-${ep}`, isAvailable: true },
      animevibe: { name: '✨ AnimeVibe', vf: (id,ep) => `https://animevibe.tv/embed/${id}-${ep}`, vostfr: (id,ep) => `https://animevibe.tv/embed/${id}-${ep}`, isAvailable: true },
      zoro: { name: '⚔️ Zoro', vf: (id,ep) => `https://zoro.to/embed/${id}-${ep}`, vostfr: (id,ep) => `https://zoro.to/embed/${id}-${ep}`, isAvailable: true }
    };

    // Générer les boutons sources dynamiquement
    function generateSourceButtons() {
      const container = document.getElementById('sourceSelector');
      if (!container) return;
      container.innerHTML = '';
      for (const [key, source] of Object.entries(embedSources)) {
        const btn = document.createElement('button');
        btn.className = `source-btn ${key === currentSource ? 'active' : ''}`;
        btn.dataset.source = key;
        btn.textContent = source.name;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSource = key;
          loadEpisode(currentEpisode);
          showToast(`Source: ${source.name}`, 'info');
        });
        container.appendChild(btn);
      }
    }

    // Corrections pour les animes très longs
    const LONG_ANIMES = {
      21: 1162, 1: 1124, 2: 500, 3: 366, 4: 291, 5: 131,
      6: 87, 7: 47, 8: 55, 9: 138, 10: 293, 154587: 28
    };

    // Requête AniList
    const ANIME_QUERY = `query ($id: Int) {
      Media(id: $id, type: ANIME) {
        id title { romaji english } coverImage { large } episodes status averageScore nextAiringEpisode { episode airingAt }
      }
    }`;

    async function fetchAnime(id) {
      try {
        const response = await fetch(PROXY + encodeURIComponent(ANILIST_API), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: ANIME_QUERY, variables: { id } })
        });
        const data = await response.json();
        return data.data?.Media;
      } catch (error) { console.error('Erreur:', error); return null; }
    }

    // ============================================
    // CHARGEMENT DE L'ANIME
    // ============================================
    async function loadAnime() {
      if (!animeId) {
        document.getElementById('animeTitle').textContent = 'ID manquant';
        showToast('ID d\'anime manquant', 'error');
        return;
      }

      try {
        const anime = await fetchAnime(parseInt(animeId));
        if (!anime) throw new Error('Anime non trouvé');
        
        animeTitle = anime.title?.romaji || anime.title?.english || 'Anime';
        episodeCount = LONG_ANIMES[animeId] || anime.episodes || 24;
        nextAiringEpisode = anime.nextAiringEpisode;
        
        document.getElementById('animeTitle').textContent = animeTitle;
        document.getElementById('currentAnimeTitle').textContent = animeTitle;
        
        const isAiring = anime.status === 'RELEASING';
        let nextEpText = '';
        if (isAiring && nextAiringEpisode) {
          const nextDate = new Date(nextAiringEpisode.airingAt * 1000);
          nextEpText = ` | 📺 Prochain: Ép. ${nextAiringEpisode.episode} le ${nextDate.toLocaleDateString('fr-FR')}`;
        }
        
        document.getElementById('animeMeta').innerHTML = `
          <span>⭐ ${(anime.averageScore / 10).toFixed(1) || 'N/A'}</span>
          <span>📺 ${episodeCount} épisodes</span>
          <span>${isAiring ? '🟢 En cours' : (anime.status === 'FINISHED' ? '✅ Terminé' : '📅 À venir')}${nextEpText}</span>
        `;
        
        generateEpisodesList();
        await restoreProgress();
        loadEpisode(currentEpisode);
        
      } catch (error) {
        console.error('Erreur:', error);
        document.getElementById('animeTitle').textContent = 'Erreur de chargement';
        showToast('Erreur de chargement de l\'anime', 'error');
      }
    }

    function generateEpisodesList() {
      const maxEpisodes = Math.min(episodeCount, 2000);
      episodesList = Array.from({ length: maxEpisodes }, (_, i) => {
        const epNum = i + 1;
        const releaseDate = new Date();
        releaseDate.setDate(releaseDate.getDate() - (episodeCount - epNum));
        return { number: epNum, title: `Épisode ${epNum}`, date: releaseDate.toLocaleDateString('fr-FR') };
      });
      displayEpisodesList();
    }

    function displayEpisodesList() {
      const container = document.getElementById('episodesList');
      if (!container) return;
      container.innerHTML = episodesList.map(ep => `
        <div class="episode-card ${ep.number === currentEpisode ? 'active' : ''}" data-ep="${ep.number}">
          <div class="episode-number">Ép. ${ep.number}</div>
          <div class="episode-title">${ep.title}</div>
          <div class="episode-date">📅 ${ep.date}</div>
          <button class="watch-btn" data-ep="${ep.number}">▶</button>
        </div>
      `).join('');
      attachEpisodeEvents();
    }

    function attachEpisodeEvents() {
      document.querySelectorAll('.episode-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('watch-btn')) return;
          const epNum = parseInt(card.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });
      document.querySelectorAll('.watch-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const epNum = parseInt(btn.dataset.ep);
          if (!isNaN(epNum)) loadEpisode(epNum);
        });
      });
    }

    // ============================================
    // LECTEUR VIDÉO
    // ============================================
    function loadEpisode(episode) {
      currentEpisode = episode;
      const videoFrame = document.getElementById('videoFrame');
      const loadingDiv = document.getElementById('videoLoading');
      if (loadingDiv) loadingDiv.style.display = 'flex';
      
      const embedUrl = embedSources[currentSource][currentLang](animeId, episode);
      if (videoFrame) {
        videoFrame.src = embedUrl;
        videoFrame.onload = () => { if (loadingDiv) loadingDiv.style.display = 'none'; };
        videoFrame.onerror = () => {
          if (loadingDiv) loadingDiv.style.display = 'none';
          showToast(`Erreur de chargement (source: ${embedSources[currentSource].name})`, 'error');
        };
      }
      setTimeout(() => { if (loadingDiv) loadingDiv.style.display = 'none'; }, 5000);
      
      document.getElementById('currentEpisodeDisplay').textContent = `Épisode ${episode}`;
      window.history.pushState({}, '', `${window.location.pathname}?id=${animeId}&ep=${episode}`);
      
      document.querySelectorAll('.episode-card').forEach(card => {
        card.classList.remove('active');
        if (parseInt(card.dataset.ep) === episode) {
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
      
      document.getElementById('progressInfo').innerHTML = `📊 Progression: Épisode ${episode}/${episodeCount}`;
      saveProgress(episode);
    }

    function saveProgress(episode) {
      localStorage.setItem(`progress_${animeId}`, episode);
    }

    async function restoreProgress() {
      const savedEpisode = localStorage.getItem(`progress_${animeId}`);
      if (savedEpisode && parseInt(savedEpisode) !== currentEpisode) {
        if (confirm(`📌 Reprendre à l'épisode ${savedEpisode} ?`)) currentEpisode = parseInt(savedEpisode);
      }
    }

    function nextEpisode() {
      if (currentEpisode < episodeCount) loadEpisode(currentEpisode + 1);
      else showToast('🎉 C\'est le dernier épisode', 'info');
    }

    function prevEpisode() {
      if (currentEpisode > 1) loadEpisode(currentEpisode - 1);
      else showToast('📺 C\'est le premier épisode', 'info');
    }

    // ============================================
    // ZOOM
    // ============================================
    function updateZoom(change) {
      currentZoom = Math.min(2, Math.max(0.5, currentZoom + change));
      const player = document.getElementById('videoPlayer');
      if (player) player.style.transform = `scale(${currentZoom})`;
      const zoomSpan = document.getElementById('zoomLevel');
      if (zoomSpan) zoomSpan.textContent = `${Math.round(currentZoom * 100)}%`;
      localStorage.setItem('zoomLevel', currentZoom);
    }

    function resetZoom() {
      currentZoom = 1;
      const player = document.getElementById('videoPlayer');
      if (player) player.style.transform = 'scale(1)';
      const zoomSpan = document.getElementById('zoomLevel');
      if (zoomSpan) zoomSpan.textContent = '100%';
      localStorage.setItem('zoomLevel', 1);
    }

    // ============================================
    // THEME SOMBRE/CLAIR
    // ============================================
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') document.body.classList.add('light-theme');
      const themeBtn = document.getElementById('themeToggle');
      if (themeBtn) themeBtn.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      const themeBtn = document.getElementById('themeToggle');
      if (themeBtn) themeBtn.textContent = isLight ? '☀️' : '🌙';
    }

    // ============================================
    // RACCOURCIS CLAVIER
    // ============================================
    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        switch(e.key) {
          case 'ArrowLeft': prevEpisode(); break;
          case 'ArrowRight': nextEpisode(); break;
          case 'f': case 'F': document.querySelector('.video-player')?.requestFullscreen(); break;
          case '+': updateZoom(0.1); break;
          case '-': updateZoom(-0.1); break;
          case '0': resetZoom(); break;
          case 'z': case 'Z': resetZoom(); break;
        }
      });
    }

    // ============================================
    // UI & INIT
    // ============================================
    function setupEventListeners() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLang = btn.dataset.lang;
          loadEpisode(currentEpisode);
          showToast(`Langue: ${currentLang === 'vf' ? 'VF' : 'VOSTFR'}`, 'info');
        });
      });
      
      document.getElementById('prevEpisodeBtn')?.addEventListener('click', prevEpisode);
      document.getElementById('nextEpisodeBtn')?.addEventListener('click', nextEpisode);
      
      const autoPlayCheckbox = document.getElementById('autoPlayNext');
      if (autoPlayCheckbox) {
        autoPlayCheckbox.addEventListener('change', (e) => {
          autoPlayNext = e.target.checked;
          localStorage.setItem('autoPlayNext', autoPlayNext);
        });
        const savedAutoPlay = localStorage.getItem('autoPlayNext');
        if (savedAutoPlay !== null) autoPlayNext = savedAutoPlay === 'true';
      }
      
      document.getElementById('episodeSearch')?.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.episode-card').forEach(card => {
          card.style.display = card.dataset.ep.includes(term) ? 'flex' : 'none';
        });
      });
      
      document.getElementById('zoomInBtn')?.addEventListener('click', () => updateZoom(0.1));
      document.getElementById('zoomOutBtn')?.addEventListener('click', () => updateZoom(-0.1));
      document.getElementById('zoomResetBtn')?.addEventListener('click', resetZoom);
      document.getElementById('zoomInMini')?.addEventListener('click', () => updateZoom(0.1));
      document.getElementById('zoomOutMini')?.addEventListener('click', () => updateZoom(-0.1));
      document.getElementById('zoomResetMini')?.addEventListener('click', resetZoom);
      document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      generateSourceButtons();
      loadAnime();
      setupEventListeners();
      setupKeyboardShortcuts();
      const savedZoom = localStorage.getItem('zoomLevel');
      if (savedZoom) {
        currentZoom = parseFloat(savedZoom);
        const player = document.getElementById('videoPlayer');
        if (player) player.style.transform = `scale(${currentZoom})`;
        const zoomSpan = document.getElementById('zoomLevel');
        if (zoomSpan) zoomSpan.textContent = `${Math.round(currentZoom * 100)}%`;
      }
    });
  </script>
</body>
</html>
