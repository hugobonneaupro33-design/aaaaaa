<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Découvrez tous les détails de l'anime : synopsis, épisodes, dates de sortie, studios">
  <meta name="theme-color" content="#e94560">
  <title>Détail Anime - Akrya Anime</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --primary: #e94560;
      --primary-dark: #c72e48;
      --bg-dark: #0a0a0f;
      --bg-card: #13131f;
      --bg-hover: #1e1e2e;
      --text-light: #f0f0f0;
      --text-muted: #8888aa;
      --border: #252540;
      --shadow: 0 8px 20px rgba(0,0,0,0.3);
      --radius: 16px;
      --radius-sm: 8px;
    }

    body.light-theme {
      --bg-dark: #f5f5f5;
      --bg-card: #ffffff;
      --bg-hover: #e8e8e8;
      --text-light: #1a1a2e;
      --text-muted: #666666;
      --border: #dddddd;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    body.light-theme header { background: linear-gradient(135deg, #e8e8e8 0%, #ffffff 100%); }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .home-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .home-link:hover { color: var(--primary-dark); }

    .tools-bar { display: flex; gap: 0.5rem; align-items: center; }
    .theme-btn {
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-btn:hover { background: var(--primary); }

    .detail-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .detail-hero {
      display: flex;
      gap: 2rem;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .detail-hero img {
      width: 250px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .detail-hero-info { flex: 1; }
    .detail-hero-info h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .detail-hero-info h2 { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 1rem; }

    .detail-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat {
      background: var(--bg-hover);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .next-episode {
      background: var(--primary);
      padding: 0.8rem 1rem;
      border-radius: var(--radius-sm);
      margin: 1rem 0;
      display: inline-block;
    }

    .watch-btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 0.8rem 2rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s;
    }
    .watch-btn:hover { background: var(--primary-dark); transform: scale(1.02); }

    .detail-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .info-card {
      background: var(--bg-card);
      padding: 1rem;
      border-radius: var(--radius);
    }
    .info-card h3 { color: var(--primary); margin-bottom: 0.8rem; }
    .info-card p { margin: 0.5rem 0; line-height: 1.4; }

    .genres-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .genre-tag {
      background: var(--primary);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
    }

    .synopsis-container {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .synopsis-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .synopsis-tab {
      padding: 0.5rem 1.2rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }
    .synopsis-tab.active { background: var(--primary); }
    .synopsis-content { line-height: 1.6; color: var(--text-muted); }

    .episodes-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .episodes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .episodes-header h3 { font-size: 1.3rem; }
    .episode-search {
      padding: 0.5rem 1rem;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: var(--text-light);
      width: 200px;
    }
    .episode-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.8rem;
      max-height: 500px;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .episode-item {
      background: var(--bg-hover);
      padding: 0.6rem;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .episode-item:hover { background: var(--primary); transform: translateY(-2px); }

    .episode-pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .ep-page-btn {
      padding: 0.4rem 0.9rem;
      background: var(--bg-hover);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-light);
      cursor: pointer;
    }
    .ep-page-btn:hover, .ep-page-btn.active { background: var(--primary); }

    .favorite-btn {
      background: none;
      border: 2px solid var(--primary);
      border-radius: 40px;
      padding: 0.5rem 1rem;
      color: var(--primary);
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      margin-top: 1rem;
      margin-right: 0.5rem;
    }
    .favorite-btn.active {
      background: var(--primary);
      color: white;
    }

    .loading, .error { text-align: center; padding: 2rem; color: var(--text-muted); }
    .error { color: var(--primary); }

    .toast {
      visibility: hidden;
      min-width: 250px;
      background: var(--bg-card);
      color: var(--text-light);
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid var(--primary);
    }
    .toast.show { visibility: visible; animation: fadeInOut 3s ease; }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }

    @media (max-width: 768px) {
      .detail-hero {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .detail-hero img { width: 200px; }
      .detail-stats { justify-content: center; }
      .episode-list { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
      .detail-container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H4a2 2 0 0 1-2-2z"/>
        </svg>
        Accueil
      </a>
      <h1>🎌 Détail de l'anime</h1>
      <div class="tools-bar">
        <button id="themeToggle" class="theme-btn">🌙</button>
      </div>
    </div>
  </header>

  <main class="detail-container">
    <div id="animeDetailContainer">
      <div class="loading">⏳ Chargement des informations...</div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    // ============================================
    // BASE DE DONNÉES LOCALE (pour éviter les erreurs API)
    // ============================================
    const ANIMES_DB = {
      21: { id: 21, title: "One Piece", title_en: "One Piece", score: 8.8, episodes: 1162, year: 1999, status: "RELEASING", image: "https://cdn.myanimelist.net/images/anime/6/73245.jpg", genres: ["Action", "Aventure"], synopsis_fr: "L'histoire de Monkey D. Luffy et son équipage à la recherche du One Piece.", synopsis_en: "The story of Monkey D. Luffy and his crew searching for One Piece." },
      7: { id: 7, title: "Jujutsu Kaisen", title_en: "Jujutsu Kaisen", score: 8.7, episodes: 47, year: 2020, status: "RELEASING", image: "https://cdn.myanimelist.net/images/anime/1171/109222.jpg", genres: ["Action"], synopsis_fr: "Les aventures de Yuji Itadori dans le monde des malédictions.", synopsis_en: "The adventures of Yuji Itadori in the world of curses." },
      8: { id: 8, title: "Demon Slayer", title_en: "Demon Slayer", score: 8.6, episodes: 55, year: 2019, status: "FINISHED", image: "https://cdn.myanimelist.net/images/anime/1286/99889.jpg", genres: ["Action", "Fantasy"], synopsis_fr: "Tanjiro combat les démons pour sauver sa soeur.", synopsis_en: "Tanjiro fights demons to save his sister." },
      15: { id: 15, title: "Dragon Ball Daima", title_en: "Dragon Ball Daima", score: 8.0, episodes: 12, year: 2024, status: "RELEASING", image: "https://cdn.myanimelist.net/images/anime/1947/144122.jpg", genres: ["Action", "Fantasy"], synopsis_fr: "Une nouvelle aventure de Goku et ses amis.", synopsis_en: "A new adventure of Goku and his friends." },
      12: { id: 12, title: "Spy x Family", title_en: "Spy x Family", score: 8.4, episodes: 25, year: 2022, status: "RELEASING", image: "https://cdn.myanimelist.net/images/anime/1441/122092.jpg", genres: ["Comedy"], synopsis_fr: "Un espion doit créer une famille pour une mission.", synopsis_en: "A spy must create a family for a mission." },
      6: { id: 6, title: "Attack on Titan", title_en: "Attack on Titan", score: 9.0, episodes: 87, year: 2013, status: "FINISHED", image: "https://cdn.myanimelist.net/images/anime/10/47347.jpg", genres: ["Action", "Drama"], synopsis_fr: "L'humanité se bat pour survivre contre les Titans.", synopsis_en: "Humanity fights to survive against the Titans." }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    
    let currentLang = 'fr';
    let itemsPerPage = 50;
    let animeData = null;
    let isFav = false;

    // ============================================
    // GESTION DES FAVORIS (compatible avec index.html)
    // ============================================
    function getFavorites() {
      const stored = localStorage.getItem('akrya_favorites');
      return stored ? JSON.parse(stored) : [];
    }

    function saveFavorites(favorites) {
      localStorage.setItem('akrya_favorites', JSON.stringify(favorites));
    }

    function isFavorite(id) {
      const favs = getFavorites();
      return favs.some(f => f.id == id && f.type === 'anime');
    }

    async function toggleFavorite() {
      if (!currentUser) { showToast('🔐 Connectez-vous', 'error'); return; }
      let favs = getFavorites();
      const index = favs.findIndex(f => f.id == animeId && f.type === 'anime');
      if (index === -1) {
        favs.push({ id: animeId, type: 'anime', title: animeData.title, image: animeData.image, score: animeData.score });
        showToast(`❤️ ${animeData.title} ajouté aux favoris`);
      } else {
        favs.splice(index, 1);
        showToast(`💔 ${animeData.title} retiré des favoris`);
      }
      saveFavorites(favs);
      if (db && currentUser) {
        await db.collection('users').doc(currentUser.uid).set({ favorites: favs }, { merge: true });
      }
      updateFavoriteButton();
    }

    function updateFavoriteButton() {
      const btn = document.getElementById('favoriteBtn');
      if (!btn) return;
      const isFav = isFavorite(animeId);
      btn.textContent = isFav ? '❤️ Dans mes favoris' : '🤍 Ajouter aux favoris';
      btn.classList.toggle('active', isFav);
    }

    // ============================================
    // AFFICHAGE
    // ============================================
    function formatDate(year, month, day) {
      if (!year) return 'Inconnue';
      return new Date(year, month - 1, day || 1).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function getStatusText(status) {
      const map = { FINISHED: '✅ Terminé', RELEASING: '🟢 En cours', NOT_YET_RELEASED: '📅 À venir', CANCELLED: '❌ Annulé' };
      return map[status] || status;
    }

    function getDescription(lang) {
      if (!animeData) return '';
      if (lang === 'fr') return animeData.synopsis_fr || 'Synopsis non disponible.';
      if (lang === 'en') return animeData.synopsis_en || 'Synopsis not available.';
      if (lang === 'es') return animeData.synopsis_es || animeData.synopsis_fr || 'Sinopsis no disponible.';
      if (lang === 'ar') return animeData.synopsis_ar || animeData.synopsis_fr || 'الملخص غير متوفر';
      if (lang === 'zh') return animeData.synopsis_zh || animeData.synopsis_fr || '概要不可用';
      return animeData.synopsis_fr || 'Synopsis non disponible.';
    }

    // ============================================
    // PAGINATION ÉPISODES
    // ============================================
    let currentEpisodePage = 1;
    let totalEpisodes = 0;

    function renderEpisodeList(episodes, start, end) {
      return episodes.slice(start, end).map(ep => `<div class="episode-item" data-ep="${ep}">${ep}</div>`).join('');
    }

    function setupEpisodePagination(total) {
      totalEpisodes = total;
      const totalPages = Math.ceil(total / itemsPerPage);
      currentEpisodePage = 1;
      
      function renderPage(page) {
        const start = (page - 1) * itemsPerPage;
        const end = Math.min(start + itemsPerPage, total);
        const episodes = Array.from({ length: total }, (_, i) => i + 1);
        const episodeList = document.getElementById('episodeList');
        if (episodeList) {
          episodeList.innerHTML = renderEpisodeList(episodes, start, end);
          document.querySelectorAll('.episode-item').forEach(item => {
            item.addEventListener('click', () => {
              window.location.href = `watch.html?id=${animeId}&ep=${item.dataset.ep}`;
            });
          });
        }
        updatePagination(page, totalPages);
      }

      function updatePagination(current, total) {
        const paginationDiv = document.getElementById('episodePagination');
        if (!paginationDiv) return;
        let pages = [];
        for (let i = Math.max(1, current - 2); i <= Math.min(total, current + 2); i++) pages.push(i);
        paginationDiv.innerHTML = `<button class="ep-page-btn" data-page="${current-1}" ${current===1 ? 'disabled' : ''}>◀</button>${pages.map(p => `<button class="ep-page-btn ${p===current?'active':''}" data-page="${p}">${p}</button>`).join('')}<button class="ep-page-btn" data-page="${current+1}" ${current===total ? 'disabled' : ''}>▶</button>`;
        document.querySelectorAll('.ep-page-btn').forEach(btn => {
          if (!btn.disabled) btn.addEventListener('click', () => {
            const newPage = parseInt(btn.dataset.page);
            if (!isNaN(newPage)) { currentEpisodePage = newPage; renderPage(currentEpisodePage); }
          });
        });
      }
      renderPage(1);
    }

    function setupEpisodeSearch() {
      document.getElementById('episodeSearch')?.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.episode-item').forEach(item => {
          item.style.display = item.dataset.ep.includes(term) ? 'flex' : 'none';
        });
      });
    }

    // ============================================
    // AFFICHAGE PRINCIPAL
    // ============================================
    function displayAnimeDetail(anime) {
      const container = document.getElementById('animeDetailContainer');
      
      const episodeCount = anime.episodes;
      const isAiring = anime.status === 'RELEASING';
      const releaseDate = formatDate(anime.year, 1, 1);
      
      container.innerHTML = `
        <div class="detail-hero">
          <img src="${anime.image}" alt="${anime.title}" onerror="this.src='https://via.placeholder.com/250x350?text=No+Image'">
          <div class="detail-hero-info">
            <h1>${anime.title}</h1>
            <h2>${anime.title_en || ''}</h2>
            <div class="detail-stats">
              <span class="stat">⭐ ${anime.score}</span>
              <span class="stat">❤️ Favoris</span>
              <span class="stat">📺 ${episodeCount} épisodes</span>
            </div>
            <div>
              <button id="favoriteBtn" class="favorite-btn">${isFavorite(anime.id) ? '❤️ Dans mes favoris' : '🤍 Ajouter aux favoris'}</button>
              <a href="watch.html?id=${anime.id}&ep=1" class="watch-btn">▶ Regarder l'épisode 1</a>
            </div>
          </div>
        </div>
        <div class="detail-info-grid">
          <div class="info-card">
            <h3>📅 Informations</h3>
            <p><strong>Statut:</strong> ${getStatusText(anime.status)}</p>
            <p><strong>Épisodes:</strong> ${episodeCount}</p>
            <p><strong>Année:</strong> ${anime.year}</p>
          </div>
          <div class="info-card">
            <h3>🏷️ Genres</h3>
            <div class="genres-list">${anime.genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>
          </div>
        </div>
        <div class="synopsis-container">
          <div class="synopsis-tabs">
            <button class="synopsis-tab ${currentLang === 'fr' ? 'active' : ''}" data-lang="fr">🇫🇷 Français</button>
            <button class="synopsis-tab ${currentLang === 'en' ? 'active' : ''}" data-lang="en">🇬🇧 English</button>
            <button class="synopsis-tab ${currentLang === 'es' ? 'active' : ''}" data-lang="es">🇪🇸 Español</button>
            <button class="synopsis-tab ${currentLang === 'ar' ? 'active' : ''}" data-lang="ar">🇸🇦 العربية</button>
            <button class="synopsis-tab ${currentLang === 'zh' ? 'active' : ''}" data-lang="zh">🇨🇳 中文</button>
          </div>
          <div id="synopsisContent" class="synopsis-content">${getDescription('fr')}</div>
        </div>
        <div class="episodes-section">
          <div class="episodes-header">
            <h3>📺 Liste des épisodes (${episodeCount})</h3>
            <input type="text" id="episodeSearch" class="episode-search" placeholder="🔍 Rechercher un épisode...">
          </div>
          <div id="episodeList" class="episode-list"></div>
          <div id="episodePagination" class="episode-pagination"></div>
        </div>
      `;

      // Synopsis multilingue
      document.querySelectorAll('.synopsis-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          currentLang = tab.dataset.lang;
          document.querySelectorAll('.synopsis-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('synopsisContent').textContent = getDescription(currentLang);
        });
      });

      // Épisodes
      if (episodeCount > 0) {
        setupEpisodePagination(episodeCount);
        setupEpisodeSearch();
      } else {
        document.getElementById('episodeList').innerHTML = '<div class="loading">Nombre d\'épisodes non disponible</div>';
      }

      // Favoris
      document.getElementById('favoriteBtn')?.addEventListener('click', toggleFavorite);
    }

    async function loadAnimeDetail() {
      if (!animeId) {
        document.getElementById('animeDetailContainer').innerHTML = '<div class="error">❌ ID manquant</div>';
        return;
      }
      
      animeData = ANIMES_DB[animeId];
      if (animeData) {
        await displayAnimeDetail(animeData);
      } else {
        document.getElementById('animeDetailContainer').innerHTML = '<div class="error">❌ Anime non trouvé</div>';
      }
    }

    // ============================================
    // THEME
    // ============================================
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') document.body.classList.add('light-theme');
      const themeBtn = document.getElementById('themeToggle');
      if (themeBtn) themeBtn.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      const themeBtn = document.getElementById('themeToggle');
      if (themeBtn) themeBtn.textContent = isLight ? '☀️' : '🌙';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ============================================
    // FIREBASE AUTH (pour les favoris)
    // ============================================
    const firebaseConfig = {
      apiKey: "AIzaSyCwDOGPUWQ08WGuAAZ9p6hS6SZytmRoKig",
      authDomain: "arkya-animemanga.firebaseapp.com",
      projectId: "arkya-animemanga",
      storageBucket: "arkya-animemanga.firebasestorage.app",
      messagingSenderId: "52570519836",
      appId: "1:52570519836:web:dbf4fcd7aafe01aac762d9"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;

    auth.onAuthStateChanged((user) => {
      currentUser = user;
    });

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
      loadAnimeDetail();
    });
  </script>
</body>
