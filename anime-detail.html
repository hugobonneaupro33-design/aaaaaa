<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail Anime - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .episode-item {
      background: #252540;
      padding: 0.5rem;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .episode-item:hover {
      background: #e94560;
      transform: translateY(-2px);
    }
    .watch-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 1.5rem;
      background: #e94560;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <h1>🎌 Détail de l'anime</h1>
    </div>
  </header>

  <main class="detail-page">
    <div id="animeDetailContainer">
      <div class="loading">Chargement...</div>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    const API_BASE = 'https://api.jikan.moe/v4';
    
    async function loadAnimeDetail() {
      if (!animeId) {
        document.getElementById('animeDetailContainer').innerHTML = '<div class="error">ID d\'anime manquant</div>';
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/anime/${animeId}`);
        const data = await response.json();
        const anime = data.data;
        
        // Générer la liste des épisodes (jusqu'à 24 par défaut)
        const episodeCount = anime.episodes || 24;
        const episodes = Array.from({ length: Math.min(episodeCount, 100) }, (_, i) => i + 1);
        
        document.getElementById('animeDetailContainer').innerHTML = `
          <div class="detail-hero">
            <img src="${anime.images.jpg.large_image_url}" alt="${anime.title}">
            <div class="detail-hero-info">
              <h1>${anime.title}</h1>
              <h2>${anime.title_english || ''}</h2>
              <div class="detail-stats">
                <span class="stat">⭐ ${anime.score || 'N/A'}</span>
                <span class="stat">📊 Rang #${anime.rank || 'N/A'}</span>
                <span class="stat">❤️ Favoris: ${anime.favorites?.toLocaleString() || '0'}</span>
              </div>
            </div>
          </div>
          
          <div class="detail-info-grid">
            <div class="info-card">
              <h3>📅 Informations</h3>
              <p><strong>Statut:</strong> ${anime.status || 'Inconnu'}</p>
              <p><strong>Épisodes:</strong> ${anime.episodes || '?'}</p>
              <p><strong>Durée:</strong> ${anime.duration || 'N/A'}</p>
              <p><strong>Studio:</strong> ${anime.studios?.map(s => s.name).join(', ') || 'N/A'}</p>
            </div>
            <div class="info-card">
              <h3>🏷️ Genres</h3>
              <div class="genres-list">
                ${anime.genres?.map(g => `<span class="genre-tag">${g.name}</span>`).join('') || 'Aucun'}
              </div>
            </div>
            <div class="info-card">
              <h3>📺 Diffusion</h3>
              <p><strong>Jour:</strong> ${anime.broadcast?.day || 'Inconnu'}</p>
              <p><strong>Horaire:</strong> ${anime.broadcast?.time || 'Inconnu'}</p>
              <p><strong>Diffuseur:</strong> ${anime.broadcast?.string || 'N/A'}</p>
            </div>
          </div>
          
          <div class="synopsis-full">
            <h3>📖 Synopsis</h3>
            <p>${anime.synopsis || 'Synopsis non disponible.'}</p>
          </div>
          
          <div class="episodes-section">
            <h3>📺 Liste des épisodes (${episodes.length})</h3>
            <div class="episodes-grid" id="episodesGrid">
              ${episodes.map(ep => `
                <div class="episode-item" data-ep="${ep}">
                  Ép. ${ep}
                </div>
              `).join('')}
            </div>
            <a href="watch.html?id=${animeId}&ep=1" class="watch-btn">▶ Regarder l'épisode 1</a>
          </div>
        `;
        
        // Ajouter les événements de clic sur les épisodes
        document.querySelectorAll('.episode-item').forEach(item => {
          item.addEventListener('click', () => {
            const epNum = item.dataset.ep;
            window.location.href = `watch.html?id=${animeId}&ep=${epNum}`;
          });
        });
        
      } catch (error) {
        console.error('Erreur:', error);
        document.getElementById('animeDetailContainer').innerHTML = '<div class="error">Erreur de chargement</div>';
      }
    }
    
    loadAnimeDetail();
  </script>
</body>
</html>
