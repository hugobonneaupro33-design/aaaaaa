<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail Anime</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <h1>🎌 Détail de l'anime</h1>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()">🔵 Google</button>
        <button onclick="loginWithFacebook()">📘 Facebook</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar">
        <span id="userName"></span>
        <button onclick="logout()">Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="detail-page">
    <div id="animeDetailContainer" class="anime-detail-container">
      <!-- Le contenu sera injecté ici -->
    </div>
    
    <!-- Section actions utilisateur (connecté uniquement) -->
    <div id="userActions" class="user-actions hidden">
      <button id="markWatchedBtn" class="action-btn">👁️ Marquer comme vu</button>
      <button id="likeBtn" class="action-btn">❤️ Liker</button>
      <div class="user-rating">
        <span>Ma note : </span>
        <select id="userRating">
          <option value="0">Non noté</option>
          <option value="1">⭐</option>
          <option value="2">⭐⭐</option>
          <option value="3">⭐⭐⭐</option>
          <option value="4">⭐⭐⭐⭐</option>
          <option value="5">⭐⭐⭐⭐⭐</option>
        </select>
      </div>
    </div>
  </main>

  <script src="firebase-config.js"></script>
  <script src="detail-page.js"></script>
</body>
</html>
