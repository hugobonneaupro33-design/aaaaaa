<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Découvrez tous les détails de l'anime : synopsis, épisodes, dates de sortie, studios et bien plus">
  <meta name="theme-color" content="#e94560">
  <title>Détail Anime - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ============================================
       STYLES SPÉCIFIQUES À LA PAGE DÉTAIL
    ============================================ */
    :root {
      --primary: #e94560;
      --primary-dark: #c72e48;
      --bg-dark: #0a0a0f;
      --bg-card: #13131f;
      --bg-hover: #1e1e2e;
      --text-light: #f0f0f0;
      --text-muted: #8888aa;
      --border: #252540;
      --shadow: 0 8px 20px rgba(0,0,0,0.3);
      --radius: 16px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .home-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .home-link:hover { color: var(--primary-dark); }

    .detail-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    .detail-hero {
      display: flex;
      gap: 2rem;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .detail-hero img {
      width: 250px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .detail-hero-info { flex: 1; }
    .detail-hero-info h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .detail-hero-info h2 { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 1rem; }
    .detail-stats { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .stat {
      background: var(--bg-hover);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .next-episode {
      background: var(--primary);
      padding: 0.8rem 1rem;
      border-radius: var(--radius-sm);
      margin: 1rem 0;
      display: inline-block;
    }
    .watch-btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 0.8rem 2rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s;
    }
    .watch-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.02);
    }
    .detail-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .info-card {
      background: var(--bg-card);
      padding: 1rem;
      border-radius: var(--radius);
    }
    .info-card h3 { color: var(--primary); margin-bottom: 0.8rem; }
    .info-card p { margin: 0.5rem 0; line-height: 1.4; }
    .genres-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .genre-tag {
      background: var(--primary);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
    }
    .synopsis-container {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .synopsis-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .synopsis-tab {
      padding: 0.5rem 1.2rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }
    .synopsis-tab.active { background: var(--primary); }
    .synopsis-content { line-height: 1.6; color: var(--text-muted); }

    .episodes-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .episodes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .episodes-header h3 { font-size: 1.3rem; }
    .episode-search {
      padding: 0.5rem 1rem;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: white;
      width: 200px;
    }
    .episode-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.8rem;
      max-height: 500px;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .episode-item {
      background: var(--bg-hover);
      padding: 0.6rem;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .episode-item:hover { background: var(--primary); transform: translateY(-2px); }
    .episode-pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .ep-page-btn {
      padding: 0.4rem 0.9rem;
      background: var(--bg-hover);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ep-page-btn:hover, .ep-page-btn.active { background: var(--primary); }

    .favorite-btn {
      background: none;
      border: 2px solid var(--primary);
      border-radius: 40px;
      padding: 0.5rem 1rem;
      color: var(--primary);
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      margin-top: 1rem;
      margin-right: 0.5rem;
    }
    .favorite-btn.active {
      background: var(--primary);
      color: white;
    }
    .loading, .error { text-align: center; padding: 2rem; color: var(--text-muted); }
    .error { color: var(--primary); }

    .toast {
      visibility: hidden;
      min-width: 250px;
      background: var(--bg-card);
      color: white;
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid var(--primary);
    }
    .toast.show { visibility: visible; animation: fadeInOut 3s ease; }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }

    @media (max-width: 768px) {
      .detail-hero { flex-direction: column; align-items: center; text-align: center; }
      .detail-hero img { width: 200px; }
      .detail-stats { justify-content: center; }
      .episode-list { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
      .detail-container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H4a2 2 0 0 1-2-2z"/></svg>
        Accueil
      </a>
      <h1>🎌 Détail de l'anime</h1>
      <div></div>
    </div>
  </header>

  <main class="detail-container">
    <div id="animeDetailContainer"><div class="loading">⏳ Chargement des informations...</div></div>
  </main>
  <div id="toast" class="toast hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    const ANILIST_API = 'https://graphql.anilist.co';

    let currentLang = 'fr';
    let itemsPerPage = 50;
    let totalEpisodes = 0;
    let animeData = null;
    let isFav = false;

    // ============================================
    // CORRECTIONS POUR LES ANIMES TRÈS LONGS (VERSION 2025)
    // ============================================
    const LONG_ANIMES = {
      21: 1162,    // One Piece (à jour 2025)
      1: 1124,     // Detective Conan (à jour)
      2: 500,      // Naruto Shippuden
      3: 366,      // Bleach
      4: 291,      // Dragon Ball Z
      5: 131,      // Dragon Ball Super
      6: 87,       // Attack on Titan
      7: 47,       // Jujutsu Kaisen
      8: 55,       // Demon Slayer
      9: 138,      // My Hero Academia
      10: 293,     // Boruto
      154587: 28   // Sousou no Frieren
    };

    // ============================================
    // REQUÊTE GRAPHQL MULTILINGUE
    // ============================================
    const DETAIL_QUERY = `
      query ($id: Int) {
        Media(id: $id, type: ANIME) {
          id
          title { romaji english native }
          coverImage { extraLarge large medium }
          bannerImage
          description
          descriptionEn: description(asHtml: false, locale: "en")
          descriptionEs: description(asHtml: false, locale: "es")
          descriptionAr: description(asHtml: false, locale: "ar")
          descriptionZh: description(asHtml: false, locale: "zh")
          averageScore
          meanScore
          popularity
          favourites
          status
          episodes
          duration
          format
          source
          season
          seasonYear
          startDate { year month day }
          endDate { year month day }
          studios { nodes { name } }
          genres
          tags { name }
          nextAiringEpisode { episode airingAt }
          relations { edges { node { id title { romaji } } } }
        }
      }
    `;

    async function fetchAnilist(query, variables) {
      try {
        const response = await fetch(ANILIST_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables })
        });
        const data = await response.json();
        if (data.errors) { console.error('GraphQL Errors:', data.errors); return null; }
        return data.data;
      } catch (error) { console.error('Erreur:', error); return null; }
    }

    async function fetchAnimeDetail(id) {
      const data = await fetchAnilist(DETAIL_QUERY, { id });
      return data?.Media || null;
    }

    // ============================================
    // GESTION DES FAVORIS
    // ============================================
    function getFavoritesFromStorage() {
      const stored = localStorage.getItem('anime_favorites');
      return stored ? JSON.parse(stored) : [];
    }

    function saveFavoritesToStorage(favorites) {
      localStorage.setItem('anime_favorites', JSON.stringify(favorites));
    }

    async function addToFavorites(type, id, title, image, score) {
      if (!currentUser) { showToast('🔐 Connectez-vous', 'error'); return false; }
      const favorites = getFavoritesFromStorage();
      if (favorites.some(f => f.id === id)) { showToast('❌ Déjà dans vos favoris'); return false; }
      favorites.push({ id, title, image, score, dateAdded: new Date().toISOString() });
      saveFavoritesToStorage(favorites);
      if (db && currentUser) {
        try { await db.collection('users').doc(currentUser.uid).set({ favorites }, { merge: true }); } catch(e) {}
      }
      showToast(`❤️ ${title} ajouté aux favoris`);
      return true;
    }

    async function removeFromFavorites(animeId) {
      if (!currentUser) return false;
      let favorites = getFavoritesFromStorage();
      const removed = favorites.find(f => f.id == animeId);
      favorites = favorites.filter(f => f.id != animeId);
      saveFavoritesToStorage(favorites);
      if (db && currentUser) {
        try { await db.collection('users').doc(currentUser.uid).set({ favorites }, { merge: true }); } catch(e) {}
      }
      if (removed) showToast(`🗑️ ${removed.title} retiré des favoris`);
      return true;
    }

    async function isInFavorites(animeId) {
      const favorites = getFavoritesFromStorage();
      return favorites.some(f => f.id == animeId);
    }

    // ============================================
    // AFFICHAGE
    // ============================================
    function formatDate(year, month, day) {
      if (!year) return 'Inconnue';
      return new Date(year, month - 1, day || 1).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function getStatusText(status) {
      const map = { FINISHED: '✅ Terminé', RELEASING: '🟢 En cours', NOT_YET_RELEASED: '📅 À venir', CANCELLED: '❌ Annulé' };
      return map[status] || status;
    }

    function cleanHtml(html) {
      if (!html) return '';
      return html.replace(/<br>/g, '\n').replace(/<[^>]*>/g, '').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
    }

    function getDescription(lang) {
      if (!animeData) return '';
      const descMap = {
        fr: animeData.description,
        en: animeData.descriptionEn,
        es: animeData.descriptionEs,
        ar: animeData.descriptionAr,
        zh: animeData.descriptionZh
      };
      return cleanHtml(descMap[lang] || animeData.description);
    }

    // ============================================
    // AFFICHAGE DES ÉPISODES
    // ============================================
    let currentEpisodePage = 1;
    let totalEpisodePages = 1;

    function renderEpisodeList(episodes, start, end) {
      return episodes.slice(start, end).map(ep => `<div class="episode-item" data-ep="${ep}">${ep}</div>`).join('');
    }

    function setupEpisodePagination(total) {
      totalEpisodePages = Math.ceil(total / itemsPerPage);
      currentEpisodePage = 1;
      
      function renderPage(page) {
        const start = (page - 1) * itemsPerPage;
        const end = Math.min(start + itemsPerPage, total);
        const episodes = Array.from({ length: total }, (_, i) => i + 1);
        const episodeList = document.getElementById('episodeList');
        if (episodeList) {
          episodeList.innerHTML = renderEpisodeList(episodes, start, end);
          document.querySelectorAll('.episode-item').forEach(item => {
            item.addEventListener('click', () => window.location.href = `watch.html?id=${animeId}&ep=${item.dataset.ep}`);
          });
        }
        updatePagination(page, totalEpisodePages);
      }

      function updatePagination(current, total) {
        const paginationDiv = document.getElementById('episodePagination');
        if (!paginationDiv) return;
        let pages = [];
        for (let i = Math.max(1, current - 2); i <= Math.min(total, current + 2); i++) pages.push(i);
        paginationDiv.innerHTML = `<button class="ep-page-btn" data-page="${current-1}" ${current===1 ? 'disabled' : ''}>◀</button>${pages.map(p => `<button class="ep-page-btn ${p===current?'active':''}" data-page="${p}">${p}</button>`).join('')}<button class="ep-page-btn" data-page="${current+1}" ${current===total ? 'disabled' : ''}>▶</button>`;
        document.querySelectorAll('.ep-page-btn').forEach(btn => {
          if (!btn.disabled) btn.addEventListener('click', () => { const newPage = parseInt(btn.dataset.page); if (!isNaN(newPage)) { currentEpisodePage = newPage; renderPage(currentEpisodePage); } });
        });
      }
      renderPage(1);
    }

    function setupEpisodeSearch() {
      document.getElementById('episodeSearch')?.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.episode-item').forEach(item => {
          item.style.display = item.dataset.ep.includes(term) ? 'flex' : 'none';
        });
      });
    }

    // ============================================
    // AFFICHAGE PRINCIPAL
    // ============================================
    async function displayAnimeDetail(anime) {
      const container = document.getElementById('animeDetailContainer');
      
      let episodeCount = LONG_ANIMES[animeId] || anime.episodes || 24;
      const isAiring = anime.status === 'RELEASING';
      const releaseDate = formatDate(anime.startDate?.year, anime.startDate?.month, anime.startDate?.day);
      const endDate = formatDate(anime.endDate?.year, anime.endDate?.month, anime.endDate?.day);
      
      let nextEpisodeText = '';
      if (isAiring && anime.nextAiringEpisode) {
        const nextDate = new Date(anime.nextAiringEpisode.airingAt * 1000);
        nextEpisodeText = `<div class="next-episode">📺 Prochain épisode: Épisode ${anime.nextAiringEpisode.episode} - ${nextDate.toLocaleDateString('fr-FR')} à ${nextDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</div>`;
      }

      container.innerHTML = `
        <div class="detail-hero">
          <img src="${anime.coverImage?.extraLarge || anime.coverImage?.large || anime.coverImage?.medium}" alt="${anime.title?.romaji}" onerror="this.src='https://via.placeholder.com/250x350?text=No+Image'">
          <div class="detail-hero-info">
            <h1>${anime.title?.romaji || anime.title?.english || 'Sans titre'}</h1>
            <h2>${anime.title?.english || anime.title?.native || ''}</h2>
            <div class="detail-stats">
              <span class="stat">⭐ ${(anime.averageScore / 10).toFixed(1) || 'N/A'}</span>
              <span class="stat">📊 Popularité #${anime.popularity?.toLocaleString() || 'N/A'}</span>
              <span class="stat">❤️ ${anime.favourites?.toLocaleString() || '0'} favoris</span>
              <span class="stat">📺 ${episodeCount} épisodes</span>
            </div>
            ${nextEpisodeText}
            <div>
              <button id="favoriteBtn" class="favorite-btn ${isFav ? 'active' : ''}">${isFav ? '❤️ Dans mes favoris' : '🤍 Ajouter aux favoris'}</button>
              <a href="watch.html?id=${anime.id}&ep=1" class="watch-btn">▶ Regarder l'épisode 1</a>
            </div>
          </div>
        </div>
        <div class="detail-info-grid">
          <div class="info-card">
            <h3>📅 Informations</h3>
            <p><strong>Statut:</strong> ${getStatusText(anime.status)}</p>
            <p><strong>Épisodes:</strong> ${episodeCount}</p>
            <p><strong>Durée:</strong> ${anime.duration || '?'} min/ép</p>
            <p><strong>Format:</strong> ${anime.format || 'TV'}</p>
            <p><strong>Source:</strong> ${anime.source || 'N/A'}</p>
            <p><strong>Saison:</strong> ${anime.season || '?'} ${anime.seasonYear || ''}</p>
          </div>
          <div class="info-card">
            <h3>🏷️ Genres</h3>
            <div class="genres-list">${anime.genres?.map(g => `<span class="genre-tag">${g}</span>`).join('') || 'Aucun genre'}</div>
            ${anime.tags?.length ? `<h3 style="margin-top:1rem;">🏷️ Tags</h3><div class="genres-list">${anime.tags.slice(0,8).map(t => `<span class="genre-tag">${t.name}</span>`).join('')}</div>` : ''}
          </div>
          <div class="info-card">
            <h3>📺 Production</h3>
            <p><strong>Studio:</strong> ${anime.studios?.nodes?.map(s => s.name).join(', ') || 'N/A'}</p>
            <p><strong>Date début:</strong> ${releaseDate}</p>
            <p><strong>Date fin:</strong> ${endDate}</p>
            ${anime.relations?.edges?.length ? `<p><strong>Liens:</strong> ${anime.relations.edges.slice(0,3).map(r => r.node.title?.romaji).join(', ')}</p>` : ''}
          </div>
        </div>
        <div class="synopsis-container">
          <div class="synopsis-tabs">
            <button class="synopsis-tab ${currentLang === 'fr' ? 'active' : ''}" data-lang="fr">🇫🇷 Français</button>
            <button class="synopsis-tab ${currentLang === 'en' ? 'active' : ''}" data-lang="en">🇬🇧 English</button>
            <button class="synopsis-tab ${currentLang === 'es' ? 'active' : ''}" data-lang="es">🇪🇸 Español</button>
            <button class="synopsis-tab ${currentLang === 'ar' ? 'active' : ''}" data-lang="ar">🇸🇦 العربية</button>
            <button class="synopsis-tab ${currentLang === 'zh' ? 'active' : ''}" data-lang="zh">🇨🇳 中文</button>
          </div>
          <div id="synopsisContent" class="synopsis-content">${getDescription('fr')}</div>
        </div>
        <div class="episodes-section">
          <div class="episodes-header">
            <h3>📺 Liste des épisodes (${episodeCount})</h3>
            <input type="text" id="episodeSearch" class="episode-search" placeholder="🔍 Rechercher un épisode...">
          </div>
          <div id="episodeList" class="episode-list"></div>
          <div id="episodePagination" class="episode-pagination"></div>
        </div>
      `;

      // Synopsis multilingue
      document.querySelectorAll('.synopsis-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          currentLang = tab.dataset.lang;
          document.querySelectorAll('.synopsis-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('synopsisContent').textContent = getDescription(currentLang) || (currentLang === 'fr' ? 'Synopsis non disponible.' : 'Synopsis not available.');
        });
      });

      // Épisodes
      if (episodeCount > 0) {
        setupEpisodePagination(episodeCount);
        setupEpisodeSearch();
      } else {
        document.getElementById('episodeList').innerHTML = '<div class="loading">Nombre d\'épisodes non disponible</div>';
      }

      // Favoris
      const favBtn = document.getElementById('favoriteBtn');
      if (favBtn) {
        favBtn.addEventListener('click', async () => {
          if (!currentUser) { showToast('🔐 Connectez-vous', 'error'); return; }
          if (isFav) {
            await removeFromFavorites(anime.id);
            isFav = false;
            favBtn.textContent = '🤍 Ajouter aux favoris';
            favBtn.classList.remove('active');
          } else {
            await addToFavorites('anime', anime.id, anime.title?.romaji, anime.coverImage?.medium, (anime.averageScore / 10).toFixed(1));
            isFav = true;
            favBtn.textContent = '❤️ Dans mes favoris';
            favBtn.classList.add('active');
          }
        });
      }
    }

    async function loadAnimeDetail() {
      if (!animeId) { document.getElementById('animeDetailContainer').innerHTML = '<div class="error">❌ ID manquant</div>'; return; }
      const anime = await fetchAnimeDetail(parseInt(animeId));
      if (anime) {
        isFav = await isInFavorites(animeId);
        animeData = anime;
        await displayAnimeDetail(anime);
      } else {
        document.getElementById('animeDetailContainer').innerHTML = '<div class="error">❌ Erreur de chargement</div>';
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.addEventListener('DOMContentLoaded', loadAnimeDetail);
  </script>
</body>
</html>
