<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- Cercle extérieur -->
  <circle cx="50" cy="50" r="42" fill="#e94560" stroke="#ff6b8b" stroke-width="2"/>
  
  <!-- Étoile/Anime symbol -->
  <text x="50" y="72" font-size="48" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold">🎌</text>
  
  <!-- Petits détails -->
  <circle cx="25" cy="25" r="3" fill="#ff6b8b"/>
  <circle cx="75" cy="25" r="3" fill="#ff6b8b"/>
  <circle cx="25" cy="75" r="3" fill="#ff6b8b"/>
  <circle cx="75" cy="75" r="3" fill="#ff6b8b"/>
</svg>
