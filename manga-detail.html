<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail Manga - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">🏠 Accueil</a>
      <h1>📖 Détail du Manga</h1>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">🔵 Connexion Google</button>
        <button onclick="loginWithFacebook()" class="facebook-btn">📘 Connexion Facebook</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">Déconnexion</button>
        <a href="profile.html" class="profile-link">📊 Mon profil</a>
      </div>
    </div>
  </header>

  <main class="detail-page">
    <div id="mangaDetailContainer" class="manga-detail-container">
      <!-- Le contenu sera injecté ici -->
    </div>
    
    <!-- Section actions utilisateur (connecté uniquement) -->
    <div id="userActions" class="user-actions hidden">
      <button id="markReadBtn" class="action-btn">📖 Marquer comme lu</button>
      <button id="likeBtn" class="action-btn">❤️ Liker</button>
      <div class="user-rating">
        <span>Ma note : </span>
        <select id="userRating">
          <option value="0">Non noté</option>
          <option value="1">⭐</option>
          <option value="2">⭐⭐</option>
          <option value="3">⭐⭐⭐</option>
          <option value="4">⭐⭐⭐⭐</option>
          <option value="5">⭐⭐⭐⭐⭐</option>
        </select>
      </div>
    </div>
  </main>

  <script src="firebase-config.js"></script>
  <script src="detail-page.js"></script>
</body>
</html>
