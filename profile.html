<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover">
  <meta name="description" content="Mon profil - Anime & Manga Info : statistiques, favoris, historique de visionnage">
  <meta name="theme-color" content="#e94560">
  <title>Mon Profil - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    /* Variables */
    :root {
      --primary: #e94560;
      --primary-dark: #c72e48;
      --bg-dark: #0a0a0f;
      --bg-card: #13131f;
      --bg-hover: #1e1e2e;
      --text-light: #f0f0f0;
      --text-muted: #8888aa;
      --border: #252540;
      --shadow: 0 8px 20px rgba(0,0,0,0.3);
      --radius: 16px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .home-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .home-link:hover {
      color: var(--primary-dark);
    }

    /* Auth */
    .auth-buttons {
      display: flex;
      gap: 0.8rem;
    }

    .google-btn, .facebook-btn, .logout-btn {
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .google-btn { background: #4285f4; color: white; }
    .facebook-btn { background: #1877f2; color: white; }
    .logout-btn { background: var(--primary); color: white; }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg-hover);
      padding: 0.4rem 1rem;
      border-radius: 40px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    /* Main */
    .profile-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Profile header */
    .profile-header {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .profile-avatar-large {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary);
      margin-bottom: 1rem;
    }

    .profile-header h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .profile-header p {
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .profile-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .profile-actions button {
      padding: 0.5rem 1.2rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .profile-actions button:hover {
      background: var(--primary);
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: center;
      transition: all 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--primary);
    }

    .stat-label {
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    /* Sections */
    .profile-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid var(--border);
    }

    .section-header h3 {
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Favorites grid */
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }

    .favorite-item {
      background: var(--bg-hover);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .favorite-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 12px rgba(233,69,96,0.2);
    }

    .favorite-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .favorite-info {
      padding: 0.8rem;
    }

    .favorite-info h4 {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .favorite-score {
      font-size: 0.75rem;
      color: #ffd700;
      margin-top: 0.3rem;
    }

    /* History list */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem;
      background: var(--bg-hover);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-item:hover {
      background: #2a2a3a;
      transform: translateX(5px);
    }

    .history-info {
      flex: 1;
    }

    .history-title {
      font-weight: bold;
      margin-bottom: 0.2rem;
    }

    .history-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .history-episode {
      background: var(--primary);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .empty-state svg {
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* Tabs */
    .profile-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .profile-tab {
      padding: 0.7rem 1.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .profile-tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Toast */
    .toast {
      visibility: hidden;
      min-width: 250px;
      background: var(--bg-card);
      color: white;
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid var(--primary);
    }
    .toast.show {
      visibility: visible;
      animation: fadeInOut 3s ease;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }

    /* Loading */
    .loading, .error {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
    .error { color: var(--primary); }

    /* Responsive */
    @media (max-width: 768px) {
      .profile-container { padding: 1rem; }
      .favorites-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .favorite-item img { height: 180px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H4a2 2 0 0 1-2-2z"/>
        </svg>
        Accueil
      </a>
      <h1>👤 Mon Profil</h1>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">🔵 Google</button>
        <button onclick="loginWithFacebook()" class="facebook-btn">📘 Facebook</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">🚪 Déconnexion</button>
        <a href="profile.html" class="profile-link">👤 Mon profil</a>
      </div>
    </div>
  </header>

  <main class="profile-container">
    <div id="profileContent">
      <div class="loading">⏳ Chargement de votre profil...</div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // ============================================
    // PROFIL UTILISATEUR
    // ============================================
    
    // Données de test pour la démo (seront remplacées par Firebase)
    let userData = null;
    let currentTab = 'favorites';

    function loadProfile() {
      const container = document.getElementById('profileContent');
      
      // Vérifier si l'utilisateur est connecté
      if (!currentUser) {
        container.innerHTML = `
          <div class="profile-header">
            <div class="empty-state">
              <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <h3>Vous n'êtes pas connecté</h3>
              <p>Connectez-vous pour accéder à votre profil et sauvegarder vos animes.</p>
              <div style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: center;">
                <button onclick="loginWithGoogle()" class="google-btn" style="padding: 0.8rem 1.5rem;">🔵 Se connecter avec Google</button>
                <button onclick="loginWithFacebook()" class="facebook-btn" style="padding: 0.8rem 1.5rem;">📘 Se connecter avec Facebook</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Utilisateur connecté - afficher le profil
      container.innerHTML = `
        <!-- Profile Header -->
        <div class="profile-header">
          <img id="profileAvatar" class="profile-avatar-large" src="${currentUser.photoURL || 'https://via.placeholder.com/120x120?text=Avatar'}" alt="Avatar">
          <h2 id="profileName">${currentUser.displayName || currentUser.email}</h2>
          <p id="profileEmail">${currentUser.email}</p>
          <div class="profile-actions">
            <button id="editProfileBtn">✏️ Modifier le profil</button>
            <button id="refreshDataBtn">🔄 Actualiser</button>
            <button id="exportDataBtn">📥 Exporter mes données</button>
          </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-number" id="statAnimes">0</div>
            <div class="stat-label">Animes vus</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="statFavorites">0</div>
            <div class="stat-label">Favoris</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="statEpisodes">0</div>
            <div class="stat-label">Épisodes regardés</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="statHours">0</div>
            <div class="stat-label">Heures visionnées</div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="profile-tabs">
          <button class="profile-tab ${currentTab === 'favorites' ? 'active' : ''}" data-tab="favorites">❤️ Favoris</button>
          <button class="profile-tab ${currentTab === 'history' ? 'active' : ''}" data-tab="history">📜 Historique</button>
          <button class="profile-tab ${currentTab === 'stats' ? 'active' : ''}" data-tab="stats">📊 Statistiques</button>
        </div>

        <!-- Tab: Favoris -->
        <div id="tabFavorites" class="tab-content ${currentTab === 'favorites' ? 'active' : ''}">
          <div class="profile-section">
            <div class="section-header">
              <h3>❤️ Mes animes favoris</h3>
              <span id="favoritesCount">0</span>
            </div>
            <div id="favoritesList" class="favorites-grid">
              <div class="loading">Chargement des favoris...</div>
            </div>
          </div>
        </div>

        <!-- Tab: Historique -->
        <div id="tabHistory" class="tab-content ${currentTab === 'history' ? 'active' : ''}">
          <div class="profile-section">
            <div class="section-header">
              <h3>📜 Historique de visionnage</h3>
              <button id="clearHistoryBtn" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">🗑️ Effacer</button>
            </div>
            <div id="historyList" class="history-list">
              <div class="loading">Chargement de l'historique...</div>
            </div>
          </div>
        </div>

        <!-- Tab: Statistiques -->
        <div id="tabStats" class="tab-content ${currentTab === 'stats' ? 'active' : ''}">
          <div class="profile-section">
            <div class="section-header">
              <h3>📊 Statistiques détaillées</h3>
            </div>
            <div id="statsDetails">
              <div class="loading">Chargement des statistiques...</div>
            </div>
          </div>
        </div>
      `;

      // Charger les données
      loadUserStats();
      loadFavorites();
      loadHistory();
      
      // Événements
      document.querySelectorAll('.profile-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          currentTab = tab.dataset.tab;
          document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
          document.getElementById(`tab${currentTab.charAt(0).toUpperCase() + currentTab.slice(1)}`).classList.add('active');
        });
      });
      
      document.getElementById('refreshDataBtn')?.addEventListener('click', () => {
        loadUserStats();
        loadFavorites();
        loadHistory();
        showToast('Données actualisées !');
      });
      
      document.getElementById('exportDataBtn')?.addEventListener('click', exportUserData);
      document.getElementById('clearHistoryBtn')?.addEventListener('click', clearHistory);
    }

    // Simuler le chargement des stats (à remplacer par Firebase)
    function loadUserStats() {
      // Stats simulées pour la démo
      const animesVus = 42;
      const favoris = 12;
      const episodesRegardes = 847;
      const heuresVues = Math.round(episodesRegardes * 24 / 60);
      
      document.getElementById('statAnimes').textContent = animesVus;
      document.getElementById('statFavorites').textContent = favoris;
      document.getElementById('statEpisodes').textContent = episodesRegardes;
      document.getElementById('statHours').textContent = heuresVues;
      
      const statsDetails = document.getElementById('statsDetails');
      if (statsDetails) {
        statsDetails.innerHTML = `
          <div style="display: grid; gap: 0.8rem;">
            <div style="display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border);">
              <span>📺 Total animes vus</span>
              <span style="color: var(--primary); font-weight: bold;">${animesVus}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border);">
              <span>❤️ Favoris</span>
              <span style="color: var(--primary); font-weight: bold;">${favoris}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border);">
              <span>🎬 Épisodes regardés</span>
              <span style="color: var(--primary); font-weight: bold;">${episodesRegardes}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border);">
              <span>⏱️ Heures visionnées</span>
              <span style="color: var(--primary); font-weight: bold;">${heuresVues}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border);">
              <span>📅 Membre depuis</span>
              <span style="color: var(--primary); font-weight: bold;">${new Date().toLocaleDateString('fr-FR')}</span>
            </div>
          </div>
        `;
      }
    }

    // Simuler le chargement des favoris
    async function loadFavorites() {
      const container = document.getElementById('favoritesList');
      if (!container) return;
      
      // Liste simulée d'animes favoris
      const favorites = [
        { id: 21, title: "One Piece", score: 8.5, image: "https://cdn.myanimelist.net/images/anime/6/73245.jpg" },
        { id: 7, title: "Jujutsu Kaisen", score: 8.7, image: "https://cdn.myanimelist.net/images/anime/1171/109222.jpg" },
        { id: 8, title: "Demon Slayer", score: 8.6, image: "https://cdn.myanimelist.net/images/anime/1286/99889.jpg" },
        { id: 9, title: "My Hero Academia", score: 8.2, image: "https://cdn.myanimelist.net/images/anime/10/78745.jpg" }
      ];
      
      document.getElementById('favoritesCount').textContent = favorites.length;
      
      if (favorites.length === 0) {
        container.innerHTML = `<div class="empty-state">❤️ Aucun favori pour le moment</div>`;
        return;
      }
      
      container.innerHTML = favorites.map(anime => `
        <div class="favorite-item" data-id="${anime.id}">
          <img src="${anime.image}" alt="${anime.title}" onerror="this.src='https://via.placeholder.com/160x200?text=No+Image'">
          <div class="favorite-info">
            <h4>${anime.title}</h4>
            <div class="favorite-score">⭐ ${anime.score}</div>
          </div>
        </div>
      `).join('');
      
      document.querySelectorAll('.favorite-item').forEach(item => {
        item.addEventListener('click', () => {
          window.location.href = `anime-detail.html?id=${item.dataset.id}`;
        });
      });
    }

    // Simuler le chargement de l'historique
    function loadHistory() {
      const container = document.getElementById('historyList');
      if (!container) return;
      
      // Historique simulé
      const history = [
        { id: 21, title: "One Piece", episode: 1085, date: "2024-03-15" },
        { id: 7, title: "Jujutsu Kaisen", episode: 47, date: "2024-03-14" },
        { id: 8, title: "Demon Slayer", episode: 55, date: "2024-03-13" }
      ];
      
      if (history.length === 0) {
        container.innerHTML = `<div class="empty-state">📜 Aucun historique pour le moment</div>`;
        return;
      }
      
      container.innerHTML = history.map(item => `
        <div class="history-item" data-id="${item.id}" data-ep="${item.episode}">
          <div class="history-info">
            <div class="history-title">${item.title}</div>
            <div class="history-meta">📅 ${new Date(item.date).toLocaleDateString('fr-FR')}</div>
          </div>
          <div class="history-episode">Ép. ${item.episode}</div>
        </div>
      `).join('');
      
      document.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', () => {
          window.location.href = `watch.html?id=${item.dataset.id}&ep=${item.dataset.ep}`;
        });
      });
    }

    function clearHistory() {
      if (confirm('Voulez-vous vraiment effacer tout votre historique ?')) {
        showToast('Historique effacé !');
        loadHistory(); // Recharger l'historique vide
      }
    }

    function exportUserData() {
      const data = {
        user: {
          name: currentUser?.displayName,
          email: currentUser?.email
        },
        stats: {
          animesVus: 42,
          favoris: 12,
          episodesRegardes: 847
        },
        exportDate: new Date().toISOString()
      };
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `anime-data-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Données exportées !');
    }

    function showToast(message) {
      let toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Observer l'état d'authentification Firebase
    function waitForAuth() {
      if (typeof auth !== 'undefined') {
        auth.onAuthStateChanged((user) => {
          currentUser = user;
          updateUIBasedOnAuth();
          loadProfile();
        });
      } else {
        setTimeout(waitForAuth, 100);
      }
    }

    waitForAuth();
  </script>
</body>
</html>
