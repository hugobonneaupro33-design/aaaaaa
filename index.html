<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime & Manga Info - Accueil</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .page-btn {
      padding: 0.5rem 1rem;
      background: #252540;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    .page-btn.active, .page-btn:hover {
      background: #e94560;
    }
    .load-more {
      text-align: center;
      margin: 2rem 0;
    }
    .load-more-btn {
      padding: 0.8rem 2rem;
      background: #e94560;
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .genre-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      justify-content: center;
    }
    .genre-filter {
      padding: 0.3rem 0.8rem;
      background: #252540;
      border: none;
      border-radius: 20px;
      color: #e0e0e0;
      cursor: pointer;
    }
    .genre-filter.active {
      background: #e94560;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>🎌 Anime & Manga Info</h1>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">🔵 Google</button>
        <button onclick="loginWithFacebook()" class="facebook-btn">📘 Facebook</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">Déconnexion</button>
        <a href="profile.html" class="profile-link">Mon profil</a>
      </div>
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Rechercher un anime/manga...">
      <button id="searchBtn">Rechercher</button>
    </div>
  </header>

  <main>
    <div class="quick-nav">
      <button class="nav-btn active" data-page="home">🏠 Accueil</button>
      <button class="nav-btn" data-page="calendar">📅 Calendrier</button>
      <button class="nav-btn" data-page="top">⭐ Top Rated</button>
      <button class="nav-btn" data-page="news">📰 Actualités</button>
    </div>

    <!-- Page Accueil -->
    <div id="homePage" class="page active">
      <div class="hero-section">
        <h2>📺 Animes populaires</h2>
        <div class="genre-filters" id="genreFilters">
          <button class="genre-filter active" data-genre="">Tous</button>
          <button class="genre-filter" data-genre="action">Action</button>
          <button class="genre-filter" data-genre="adventure">Aventure</button>
          <button class="genre-filter" data-genre="comedy">Comédie</button>
          <button class="genre-filter" data-genre="drama">Drame</button>
          <button class="genre-filter" data-genre="fantasy">Fantasy</button>
          <button class="genre-filter" data-genre="romance">Romance</button>
          <button class="genre-filter" data-genre="sci-fi">Sci-Fi</button>
        </div>
        <div id="animeGrid" class="grid"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>

    <!-- Page Calendrier -->
    <div id="calendarPage" class="page hidden">
      <h2>📅 Calendrier des sorties</h2>
      <div id="calendarGrid" class="calendar-grid"></div>
    </div>

    <!-- Page Top Rated -->
    <div id="topPage" class="page hidden">
      <div class="categories">
        <button class="cat-btn active" data-cat="anime">📺 Anime</button>
        <button class="cat-btn" data-cat="manga">📖 Manga</button>
      </div>
      <div id="topGrid" class="grid"></div>
    </div>

    <!-- Page Actualités -->
    <div id="newsPage" class="page hidden">
      <div id="newsGrid" class="news-grid"></div>
    </div>

    <div id="searchResults" class="search-results hidden">
      <h2>Résultats</h2>
      <div id="resultsGrid" class="grid"></div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const API_BASE = 'https://api.jikan.moe/v4';
    let currentPage = 1;
    let currentGenre = '';
    let totalPages = 0;
    let isLoading = false;

    // ============================================
    // CHARGEMENT DES ANIMES AVEC PAGINATION
    // ============================================
    async function loadAnimes(page = 1, genre = '') {
      if (isLoading) return;
      isLoading = true;
      
      const grid = document.getElementById('animeGrid');
      grid.innerHTML = '<div class="loading">⏳ Chargement...</div>';
      
      try {
        let url = `${API_BASE}/top/anime?page=${page}&limit=24`;
        if (genre) {
          url = `${API_BASE}/anime?genres=${genre}&page=${page}&limit=24&order_by=score&sort=desc`;
        }
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.data) {
          // Correction du nombre d'épisodes pour les animes longs
          const animesCorriges = data.data.map(anime => {
            // Correction manuelle pour les animes avec épisodes incorrects
            const corrections = {
              21: 1122,    // One Piece
              1: 1000,     // Naruto
              2: 500,      // Naruto Shippuden
              3: 366,      // Bleach
              4: 153,      // Dragon Ball Z
              5: 64,       // Dragon Ball Super
              6: 25,       // Attack on Titan
              7: 47,       // Jujutsu Kaisen
              8: 55,       // Demon Slayer
              9: 138,      // My Hero Academia
              10: 293      // Boruto
            };
            
            if (corrections[anime.mal_id]) {
              anime.episodes = corrections[anime.mal_id];
            }
            return anime;
          });
          
          totalPages = data.pagination?.last_visible_page || 1;
          displayAnimes(animesCorriges);
          displayPagination(page, totalPages);
        }
      } catch (error) {
        console.error('Erreur:', error);
        grid.innerHTML = '<div class="error">❌ Erreur de chargement</div>';
      }
      
      isLoading = false;
    }

    function displayAnimes(animes) {
      const grid = document.getElementById('animeGrid');
      grid.innerHTML = animes.map(anime => `
        <div class="card" data-id="${anime.mal_id}" data-type="anime">
          <img src="${anime.images.jpg.image_url}" alt="${anime.title}" loading="lazy">
          <div class="card-info">
            <h3>${anime.title.length > 30 ? anime.title.substring(0,27)+'...' : anime.title}</h3>
            <div class="score">⭐ ${anime.score || 'N/A'}</div>
            <div class="episodes-info">📺 ${anime.episodes || '?'} épisodes</div>
            <div class="status">${anime.status === 'Currently Airing' ? '🟢 En cours' : (anime.status === 'Finished Airing' ? '✅ Terminé' : '📅 À venir')}</div>
          </div>
        </div>
      `).join('');
      
      document.querySelectorAll('#animeGrid .card').forEach(card => {
        card.addEventListener('click', () => {
          window.location.href = `anime-detail.html?id=${card.dataset.id}`;
        });
      });
    }

    function displayPagination(currentPage, total) {
      const paginationDiv = document.getElementById('pagination');
      if (!paginationDiv) return;
      
      let pages = [];
      for (let i = Math.max(1, currentPage - 2); i <= Math.min(total, currentPage + 2); i++) {
        pages.push(i);
      }
      
      paginationDiv.innerHTML = `
        <button class="page-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>◀ Précédent</button>
        ${pages.map(p => `<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`).join('')}
        <button class="page-btn" data-page="${currentPage + 1}" ${currentPage === total ? 'disabled' : ''}>Suivant ▶</button>
      `;
      
      document.querySelectorAll('.page-btn').forEach(btn => {
        if (!btn.disabled) {
          btn.addEventListener('click', () => {
            const newPage = parseInt(btn.dataset.page);
            if (!isNaN(newPage) && newPage !== currentPage) {
              currentPage = newPage;
              loadAnimes(currentPage, currentGenre);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          });
        }
      });
    }

    // ============================================
    // CALENDRIER AVEC DATES CORRECTES
    // ============================================
    async function loadCalendar() {
      const calendarGrid = document.getElementById('calendarGrid');
      calendarGrid.innerHTML = '<div class="loading">⏳ Chargement...</div>';
      
      try {
        const response = await fetch(`${API_BASE}/schedules`);
        const data = await response.json();
        
        const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
        const scheduleByDay = { 'Lundi': [], 'Mardi': [], 'Mercredi': [], 'Jeudi': [], 'Vendredi': [], 'Samedi': [], 'Dimanche': [] };
        
        if (data.data) {
          data.data.forEach(anime => {
            const day = anime.broadcast?.day;
            if (day) {
              const dayFr = {
                'monday': 'Lundi', 'tuesday': 'Mardi', 'wednesday': 'Mercredi',
                'thursday': 'Jeudi', 'friday': 'Vendredi', 'saturday': 'Samedi', 'sunday': 'Dimanche'
              }[day.toLowerCase()];
              if (dayFr && scheduleByDay[dayFr]) {
                scheduleByDay[dayFr].push({
                  ...anime,
                  nextEpisode: anime.broadcast?.time ? `${anime.broadcast.day} ${anime.broadcast.time}` : 'Date inconnue'
                });
              }
            }
          });
        }
        
        calendarGrid.innerHTML = days.map(day => `
          <div class="calendar-day">
            <h4>${day}</h4>
            ${scheduleByDay[day].map(anime => `
              <div class="calendar-episode" data-id="${anime.mal_id}">
                <strong>${anime.title.substring(0, 25)}</strong>
                <small>⏰ ${anime.broadcast?.time || 'Horaire inconnu'}</small>
                <small>📺 Prochain épisode: ${anime.nextEpisode || 'N/A'}</small>
              </div>
            `).join('')}
            ${scheduleByDay[day].length === 0 ? '<small>Aucune sortie</small>' : ''}
          </div>
        `).join('');
        
        document.querySelectorAll('.calendar-episode').forEach(ep => {
          ep.addEventListener('click', () => {
            window.location.href = `anime-detail.html?id=${ep.dataset.id}`;
          });
        });
        
      } catch (error) {
        console.error('Erreur:', error);
        calendarGrid.innerHTML = '<div class="error">❌ Erreur de chargement</div>';
      }
    }

    // ============================================
    // TOP RATED CORRIGÉ
    // ============================================
    async function loadTopRated(category = 'anime') {
      const container = document.getElementById('topGrid');
      if (!container) return;
      
      container.innerHTML = '<div class="loading">⏳ Chargement...</div>';
      
      try {
        const response = await fetch(`${API_BASE}/top/${category}?limit=30`);
        const data = await response.json();
        
        if (data.data) {
          container.innerHTML = data.data.map(item => `
            <div class="card" data-id="${item.mal_id}" data-type="${category}">
              <img src="${item.images.jpg.image_url}" alt="${item.title}" loading="lazy">
              <div class="card-info">
                <h3>${item.title.length > 30 ? item.title.substring(0,27)+'...' : item.title}</h3>
                <div class="score">⭐ ${item.score || 'N/A'}</div>
                <div class="rank">🏆 Rang #${item.rank || 'N/A'}</div>
              </div>
            </div>
          `).join('');
          
          document.querySelectorAll('#topGrid .card').forEach(card => {
            card.addEventListener('click', () => {
              window.location.href = `${card.dataset.type}-detail.html?id=${card.dataset.id}`;
            });
          });
        }
      } catch (error) {
        console.error('Erreur:', error);
        container.innerHTML = '<div class="error">❌ Erreur de chargement</div>';
      }
    }

    // ============================================
    // ACTUALITÉS
    // ============================================
    async function loadNews() {
      const container = document.getElementById('newsGrid');
      if (!container) return;
      
      container.innerHTML = '<div class="loading">⏳ Chargement...</div>';
      
      try {
        const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.animenewsnetwork.com/news/rss.xml');
        const data = await response.json();
        
        if (data.items) {
          container.innerHTML = data.items.slice(0, 15).map(item => `
            <div class="news-card" onclick="window.open('${item.link}', '_blank')">
              <img src="${item.enclosure?.link || 'https://via.placeholder.com/300x180?text=Anime+News'}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x180?text=News'">
              <div class="news-content">
                <span class="news-source">📰 Anime News Network</span>
                <h3>${item.title.substring(0, 100)}${item.title.length > 100 ? '...' : ''}</h3>
                <p>${(item.description?.replace(/<[^>]*>/g, '') || '').substring(0, 120)}...</p>
                <div class="news-meta">
                  <span>📅 ${new Date(item.pubDate).toLocaleDateString('fr-FR')}</span>
                </div>
              </div>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Erreur:', error);
        container.innerHTML = '<div class="error">❌ Erreur</div>';
      }
    }

    // ============================================
    // NAVIGATION
    // ============================================
    function switchPage(page) {
      const pages = ['homePage', 'calendarPage', 'topPage', 'newsPage'];
      pages.forEach(p => {
        const el = document.getElementById(p);
        if (el) el.classList.add('hidden');
      });
      
      document.getElementById(page).classList.remove('hidden');
      
      if (page === 'calendarPage') loadCalendar();
      else if (page === 'topPage') loadTopRated('anime');
      else if (page === 'newsPage') loadNews();
    }

    // ============================================
    // INITIALISATION
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      loadAnimes(1, '');
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          switchPage(btn.dataset.page + 'Page');
        });
      });
      
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadTopRated(btn.dataset.cat);
        });
      });
      
      document.querySelectorAll('.genre-filter').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.genre-filter').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentGenre = btn.dataset.genre;
          currentPage = 1;
          loadAnimes(currentPage, currentGenre);
        });
      });
      
      // Recherche
      const searchBtn = document.getElementById('searchBtn');
      const searchInput = document.getElementById('searchInput');
      if (searchBtn) {
        searchBtn.addEventListener('click', async () => {
          const query = searchInput.value;
          if (!query.trim()) return;
          
          const resultsGrid = document.getElementById('resultsGrid');
          const searchSection = document.getElementById('searchResults');
          document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
          searchSection.classList.remove('hidden');
          resultsGrid.innerHTML = '<div class="loading">Recherche...</div>';
          
          try {
            const response = await fetch(`${API_BASE}/anime?q=${encodeURIComponent(query)}&limit=30`);
            const data = await response.json();
            resultsGrid.innerHTML = data.data.map(anime => `
              <div class="card" data-id="${anime.mal_id}">
                <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
                <div class="card-info">
                  <h3>${anime.title.length > 30 ? anime.title.substring(0,27)+'...' : anime.title}</h3>
                  <div class="score">⭐ ${anime.score || 'N/A'}</div>
                </div>
              </div>
            `).join('');
            
            document.querySelectorAll('#resultsGrid .card').forEach(card => {
              card.addEventListener('click', () => {
                window.location.href = `anime-detail.html?id=${card.dataset.id}`;
              });
            });
          } catch (error) {
            resultsGrid.innerHTML = '<div class="error">Erreur de recherche</div>';
          }
        });
      }
    });
  </script>
</body>
</html>
