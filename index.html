<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Anime & Manga Info - Découvrez les animes, tendances, calendrier et actualités">
  <meta name="theme-color" content="#e94560">
  <title>Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Variables et reset */
    :root {
      --primary: #e94560;
      --primary-dark: #c72e48;
      --bg-dark: #0a0a0f;
      --bg-card: #13131f;
      --bg-hover: #1e1e2e;
      --text-light: #f0f0f0;
      --text-muted: #8888aa;
      --border: #252540;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .logo h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--primary), #ff6b8b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo p { font-size: 0.7rem; color: var(--text-muted); }
    
    /* Auth */
    .auth-buttons { display: flex; gap: 0.8rem; }
    .google-btn, .facebook-btn, .logout-btn {
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .google-btn { background: #4285f4; color: white; }
    .facebook-btn { background: #1877f2; color: white; }
    .logout-btn { background: var(--primary); color: white; }
    .user-menu {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg-hover);
      padding: 0.4rem 1rem;
      border-radius: 40px;
    }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .profile-link { color: var(--primary); text-decoration: none; }
    
    /* Recherche */
    .search-container { max-width: 600px; margin: 1rem auto 0; position: relative; }
    .search-wrapper {
      display: flex;
      background: var(--bg-hover);
      border-radius: 50px;
      border: 2px solid var(--border);
    }
    .search-wrapper:focus-within { border-color: var(--primary); }
    #searchInput {
      flex: 1;
      padding: 0.8rem 1.5rem;
      background: transparent;
      border: none;
      color: white;
      outline: none;
    }
    #searchBtn {
      padding: 0 1.5rem;
      background: var(--primary);
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .search-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-radius: 16px;
      max-height: 400px;
      overflow-y: auto;
      z-index: 200;
      display: none;
    }
    .search-dropdown.active { display: block; }
    .search-item {
      display: flex;
      gap: 1rem;
      padding: 0.8rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .search-item:hover { background: var(--bg-hover); }
    .search-item img { width: 50px; height: 70px; object-fit: cover; border-radius: 8px; }
    
    /* Navigation */
    .quick-nav {
      display: flex;
      gap: 0.5rem;
      margin: 2rem 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-btn {
      padding: 0.7rem 1.5rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 40px;
      color: var(--text-light);
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .nav-btn.active { background: var(--primary); }
    .nav-btn:hover { background: var(--primary); transform: translateY(-2px); }
    
    /* Filtres */
    .filters-section { margin-bottom: 2rem; }
    .filter-title { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; color: var(--primary); }
    .genre-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .genre-filter {
      padding: 0.4rem 1rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: var(--text-light);
      cursor: pointer;
    }
    .genre-filter.active { background: var(--primary); }
    
    /* Grilles */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    .anime-card {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
    }
    .anime-card:hover { transform: translateY(-5px); }
    .anime-card img { width: 100%; height: 280px; object-fit: cover; }
    .anime-info { padding: 1rem; }
    .anime-info h3 { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .anime-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; }
    .score { color: #ffd700; }
    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--primary);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
    }
    
    /* Pagination */
    .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 2rem; }
    .page-btn {
      padding: 0.5rem 1rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    .page-btn.active { background: var(--primary); }
    
    /* Calendrier */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1rem; overflow-x: auto; }
    .calendar-day {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1rem;
      min-width: 130px;
    }
    .calendar-day h4 { color: var(--primary); text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; margin-bottom: 0.8rem; }
    .calendar-episode {
      background: var(--bg-hover);
      border-radius: 8px;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .calendar-episode:hover { background: var(--primary); }
    
    /* Actualités */
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .news-card {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
    }
    .news-card img { width: 100%; height: 180px; object-fit: cover; }
    .news-content { padding: 1rem; }
    .news-source { background: var(--primary); padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.7rem; display: inline-block; margin-bottom: 0.5rem; }
    .news-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem; }
    
    .section-title { font-size: 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .section-title::before { content: ''; width: 4px; height: 24px; background: var(--primary); border-radius: 4px; }
    .page { display: block; }
    .page.hidden { display: none !important; }
    .hidden { display: none !important; }
    .loading, .error { text-align: center; padding: 2rem; color: var(--text-muted); }
    .toast {
      visibility: hidden;
      min-width: 250px;
      background: var(--bg-card);
      color: white;
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid var(--primary);
    }
    .toast.show { visibility: visible; animation: fadeInOut 3s ease; }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }
    @media (max-width: 768px) {
      .header-top { flex-direction: column; text-align: center; }
      .anime-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .anime-card img { height: 220px; }
      .calendar-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="logo">
        <h1>🎌 Anime & Manga Info</h1>
        <p>Votre source d'actualités manga & anime</p>
      </div>
      <div id="authButtons" class="auth-buttons">
        <button onclick="loginWithGoogle()" class="google-btn">🔵 Google</button>
        <button onclick="loginWithFacebook()" class="facebook-btn">📘 Facebook</button>
      </div>
      <div id="userMenu" class="user-menu hidden">
        <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">🚪 Déconnexion</button>
        <a href="profile.html" class="profile-link">👤 Mon profil</a>
      </div>
    </div>
    <div class="search-container">
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Rechercher un anime..." autocomplete="off">
        <button id="searchBtn">🔍 Rechercher</button>
      </div>
      <div id="searchDropdown" class="search-dropdown"></div>
    </div>
  </header>

  <main style="padding: 1rem 2rem; max-width: 1400px; margin: 0 auto;">
    <div class="quick-nav">
      <button class="nav-btn active" data-tab="home">🏠 Accueil</button>
      <button class="nav-btn" data-tab="calendar">📅 Calendrier</button>
      <button class="nav-btn" data-tab="top">⭐ Top Rated</button>
      <button class="nav-btn" data-tab="news">📰 Actualités</button>
    </div>

    <!-- Page Accueil -->
    <div id="homePage" class="page">
      <div class="filters-section">
        <div class="filter-title">🎯 Filtrer par genre</div>
        <div class="genre-filters" id="genreFilters">
          <button class="genre-filter active" data-genre="">🌟 Tous</button>
          <button class="genre-filter" data-genre="action">⚔️ Action</button>
          <button class="genre-filter" data-genre="adventure">🗺️ Aventure</button>
          <button class="genre-filter" data-genre="comedy">😄 Comédie</button>
          <button class="genre-filter" data-genre="drama">🎭 Drame</button>
          <button class="genre-filter" data-genre="fantasy">✨ Fantasy</button>
          <button class="genre-filter" data-genre="romance">💕 Romance</button>
          <button class="genre-filter" data-genre="sci-fi">🤖 Sci-Fi</button>
        </div>
      </div>
      <div class="section-title">📺 Dernières sorties</div>
      <div id="animeGrid" class="anime-grid"><div class="loading">⏳ Chargement...</div></div>
      <div id="pagination" class="pagination"></div>
    </div>

    <!-- Calendrier -->
    <div id="calendarPage" class="page hidden">
      <div class="section-title">📅 Calendrier des sorties</div>
      <div id="calendarGrid" class="calendar-grid"><div class="loading">⏳ Chargement...</div></div>
    </div>

    <!-- Top Rated -->
    <div id="topPage" class="page hidden">
      <div class="section-title">⭐ Top Rated Anime</div>
      <div id="topGrid" class="anime-grid"><div class="loading">⏳ Chargement...</div></div>
    </div>

    <!-- Actualités -->
    <div id="newsPage" class="page hidden">
      <div class="section-title">📰 Actualités Anime</div>
      <div id="newsGrid" class="news-grid"><div class="loading">⏳ Chargement...</div></div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script>
    // ============================================
    // ANILIST API - PAS DE CORS !
    // ============================================
    const ANILIST_API = 'https://graphql.anilist.co';
    
    let currentPage = 1;
    let currentGenre = '';
    let currentTab = 'home';
    let searchTimeout = null;

    // Requête GraphQL pour les animes populaires
    const ANIME_QUERY = `
      query ($page: Int, $perPage: Int, $genre: String) {
        Page(page: $page, perPage: $perPage) {
          pageInfo { total currentPage lastPage hasNextPage }
          media(type: ANIME, sort: START_DATE_DESC, genre_in: $genre) {
            id
            title { romaji english }
            coverImage { large medium }
            averageScore
            favourites
            status
            startDate { year month day }
            episodes
          }
        }
      }
    `;

    // Requête pour le top rated
    const TOP_QUERY = `
      query ($page: Int, $perPage: Int) {
        Page(page: $page, perPage: $perPage) {
          pageInfo { total currentPage lastPage }
          media(type: ANIME, sort: SCORE_DESC) {
            id
            title { romaji english }
            coverImage { large }
            averageScore
            favourites
            status
            episodes
          }
        }
      }
    `;

    // Requête pour le calendrier
    const SCHEDULE_QUERY = `
      query ($weekStart: Int, $weekEnd: Int) {
        Page(page: 1, perPage: 50) {
          media(type: ANIME, startDate_greater: $weekStart, startDate_lesser: $weekEnd, sort: START_DATE) {
            id
            title { romaji }
            coverImage { medium }
            startDate { year month day }
            nextAiringEpisode { episode airingAt }
          }
        }
      }
    `;

    // Requête de recherche
    const SEARCH_QUERY = `
      query ($search: String) {
        Page(page: 1, perPage: 10) {
          media(type: ANIME, search: $search) {
            id
            title { romaji english }
            coverImage { medium }
            averageScore
            status
            episodes
          }
        }
      }
    `;

    async function fetchAnilist(query, variables) {
      try {
        const response = await fetch(ANILIST_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables })
        });
        const data = await response.json();
        return data.data;
      } catch (error) {
        console.error('Erreur AniList:', error);
        return null;
      }
    }

    // ============================================
    // AFFICHAGE DES ANIMES
    // ============================================
    function formatDate(year, month, day) {
      if (!year) return 'Date inconnue';
      return `${day || 1}/${month || 1}/${year}`;
    }

    function displayAnimes(media, containerId) {
      const container = document.getElementById(containerId);
      if (!media || media.length === 0) {
        container.innerHTML = '<div class="error">❌ Aucun résultat</div>';
        return;
      }
      container.innerHTML = media.map(anime => `
        <div class="anime-card" data-id="${anime.id}">
          <span class="badge">${anime.status === 'RELEASING' ? '🟢 En cours' : (anime.status === 'FINISHED' ? '✅ Terminé' : '📅 À venir')}</span>
          <img src="${anime.coverImage?.large || anime.coverImage?.medium}" alt="${anime.title?.romaji}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x280?text=No+Image'">
          <div class="anime-info">
            <h3>${anime.title?.romaji || anime.title?.english || 'Sans titre'}</h3>
            <div class="anime-meta">
              <span class="score">⭐ ${(anime.averageScore / 10).toFixed(1) || 'N/A'}</span>
              <span>📺 ${anime.episodes || '?'} ép</span>
            </div>
            <div class="anime-meta">
              <span>❤️ ${anime.favourites?.toLocaleString() || '0'}</span>
            </div>
          </div>
        </div>
      `).join('');
      
      document.querySelectorAll(`#${containerId} .anime-card`).forEach(card => {
        card.addEventListener('click', () => {
          window.location.href = `anime-detail.html?id=${card.dataset.id}`;
        });
      });
    }

    // ============================================
    // CHARGEMENT DES ANIMES
    // ============================================
    async function loadAnimes(page = 1, genre = '') {
      const genreVar = genre ? [genre.toUpperCase()] : null;
      const data = await fetchAnilist(ANIME_QUERY, { page, perPage: 24, genre: genreVar });
      if (data?.Page?.media) {
        displayAnimes(data.Page.media, 'animeGrid');
        const pageInfo = data.Page.pageInfo;
        displayPagination(page, pageInfo.lastPage || 1);
      } else {
        document.getElementById('animeGrid').innerHTML = '<div class="error">❌ Erreur de chargement</div>';
      }
    }

    function displayPagination(currentPage, totalPages) {
      const paginationDiv = document.getElementById('pagination');
      if (!paginationDiv || totalPages <= 1) { paginationDiv.innerHTML = ''; return; }
      
      let pages = [];
      for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) pages.push(i);
      
      paginationDiv.innerHTML = `
        <button class="page-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>◀ Précédent</button>
        ${pages.map(p => `<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`).join('')}
        <button class="page-btn" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>Suivant ▶</button>
      `;
      
      document.querySelectorAll('.page-btn').forEach(btn => {
        if (!btn.disabled) {
          btn.addEventListener('click', () => {
            const newPage = parseInt(btn.dataset.page);
            if (!isNaN(newPage) && newPage !== currentPage) {
              loadAnimes(newPage, currentGenre);
              window.scrollTo({ top: 0 });
            }
          });
        }
      });
    }

    // ============================================
    // TOP RATED
    // ============================================
    async function loadTopRated() {
      const data = await fetchAnilist(TOP_QUERY, { page: 1, perPage: 30 });
      if (data?.Page?.media) {
        displayAnimes(data.Page.media, 'topGrid');
      } else {
        document.getElementById('topGrid').innerHTML = '<div class="error">❌ Erreur de chargement</div>';
      }
    }

    // ============================================
    // CALENDRIER
    // ============================================
    async function loadCalendar() {
      const container = document.getElementById('calendarGrid');
      container.innerHTML = '<div class="loading">⏳ Chargement...</div>';
      
      const today = new Date();
      const weekStart = new Date(today);
      weekStart.setDate(today.getDate() - today.getDay() + 1);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      
      const startTimestamp = Math.floor(weekStart.getTime() / 1000);
      const endTimestamp = Math.floor(weekEnd.getTime() / 1000);
      
      const data = await fetchAnilist(SCHEDULE_QUERY, { weekStart: startTimestamp, weekEnd: endTimestamp });
      
      const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
      const scheduleByDay = {};
      days.forEach(d => scheduleByDay[d] = []);
      
      if (data?.Page?.media) {
        data.Page.media.forEach(anime => {
          if (anime.nextAiringEpisode) {
            const airingDate = new Date(anime.nextAiringEpisode.airingAt * 1000);
            const dayName = days[airingDate.getDay() === 0 ? 6 : airingDate.getDay() - 1];
            if (scheduleByDay[dayName]) {
              scheduleByDay[dayName].push(anime);
            }
          }
        });
      }
      
      container.innerHTML = days.map(day => `
        <div class="calendar-day">
          <h4>${day}</h4>
          ${scheduleByDay[day].map(anime => `
            <div class="calendar-episode" data-id="${anime.id}">
              <strong>${anime.title?.romaji?.substring(0, 20) || '?'}</strong>
              <small>Ép. ${anime.nextAiringEpisode?.episode || '?'}</small>
            </div>
          `).join('')}
          ${scheduleByDay[day].length === 0 ? '<small>Aucune sortie</small>' : ''}
        </div>
      `).join('');
      
      document.querySelectorAll('.calendar-episode').forEach(ep => {
        ep.addEventListener('click', () => {
          window.location.href = `anime-detail.html?id=${ep.dataset.id}`;
        });
      });
    }

    // ============================================
    // ACTUALITÉS
    // ============================================
    async function loadNews() {
      const container = document.getElementById('newsGrid');
      container.innerHTML = '<div class="loading">⏳ Chargement...</div>';
      try {
        const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.animenewsnetwork.com/news/rss.xml');
        const data = await response.json();
        if (data.items) {
          container.innerHTML = data.items.slice(0, 12).map(item => `
            <div class="news-card" onclick="window.open('${item.link}', '_blank')">
              <img src="${item.enclosure?.link || 'https://via.placeholder.com/300x180?text=Anime+News'}" alt="${item.title}">
              <div class="news-content">
                <span class="news-source">📰 Anime News Network</span>
                <h3>${item.title.substring(0, 100)}</h3>
                <p>${(item.description?.replace(/<[^>]*>/g, '') || '').substring(0, 120)}...</p>
                <div class="news-meta">📅 ${new Date(item.pubDate).toLocaleDateString('fr-FR')}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (error) {
        container.innerHTML = '<div class="error">❌ Erreur de chargement</div>';
      }
    }

    // ============================================
    // RECHERCHE
    // ============================================
    async function performSearch(query) {
      if (!query.trim()) {
        document.getElementById('searchDropdown').classList.remove('active');
        return;
      }
      const data = await fetchAnilist(SEARCH_QUERY, { search: query });
      const dropdown = document.getElementById('searchDropdown');
      if (data?.Page?.media?.length > 0) {
        dropdown.innerHTML = data.Page.media.map(anime => `
          <div class="search-item" data-id="${anime.id}">
            <img src="${anime.coverImage?.medium}" onerror="this.src='https://via.placeholder.com/50x70'">
            <div>
              <h4>${anime.title?.romaji || anime.title?.english}</h4>
              <p>⭐ ${(anime.averageScore / 10).toFixed(1) || 'N/A'} | ${anime.status === 'RELEASING' ? '🟢 En cours' : '✅ Terminé'}</p>
            </div>
          </div>
        `).join('');
        dropdown.classList.add('active');
        document.querySelectorAll('.search-item').forEach(item => {
          item.addEventListener('click', () => {
            window.location.href = `anime-detail.html?id=${item.dataset.id}`;
          });
        });
      } else {
        dropdown.innerHTML = '<div class="search-item">Aucun résultat</div>';
        dropdown.classList.add('active');
      }
    }

    // ============================================
    // NAVIGATION
    // ============================================
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(tab + 'Page').classList.remove('hidden');
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      if (tab === 'calendar') loadCalendar();
      else if (tab === 'top') loadTopRated();
      else if (tab === 'news') loadNews();
    }

    // ============================================
    // INITIALISATION
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      loadAnimes(1, '');
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
      
      document.querySelectorAll('.genre-filter').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.genre-filter').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentGenre = btn.dataset.genre;
          loadAnimes(1, currentGenre);
        });
      });
      
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => performSearch(e.target.value), 300);
      });
      searchBtn.addEventListener('click', () => performSearch(searchInput.value));
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) {
          document.getElementById('searchDropdown').classList.remove('active');
        }
      });
    });

    // Auth simplifiée (à connecter avec Firebase)
    window.loginWithGoogle = () => showToast('🔧 Connexion Google à configurer');
    window.loginWithFacebook = () => showToast('🔧 Connexion Facebook à configurer');
    window.logout = () => showToast('Déconnexion');
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
