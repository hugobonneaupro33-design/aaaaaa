<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover">
  <meta name="description" content="Découvrez les détails du manga : synopsis, chapitres, informations et lecture en ligne">
  <meta name="theme-color" content="#e94560">
  <title>Détail Manga - Anime & Manga Info</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    /* ============================================
       STYLES MANGA DETAIL
    ============================================ */
    :root {
      --primary: #e94560;
      --primary-dark: #c72e48;
      --bg-dark: #0a0a0f;
      --bg-card: #13131f;
      --bg-hover: #1e1e2e;
      --text-light: #f0f0f0;
      --text-muted: #8888aa;
      --border: #252540;
      --shadow: 0 8px 20px rgba(0,0,0,0.3);
      --radius: 16px;
      --radius-sm: 8px;
    }

    /* Theme clair */
    body.light-theme {
      --bg-dark: #f5f5f5;
      --bg-card: #ffffff;
      --bg-hover: #e8e8e8;
      --text-light: #1a1a2e;
      --text-muted: #666666;
      --border: #dddddd;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    body.light-theme header {
      background: linear-gradient(135deg, #e8e8e8 0%, #ffffff 100%);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .home-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tools-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .theme-btn {
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      color: var(--text-light);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      background: var(--primary);
    }

    .detail-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .detail-hero {
      display: flex;
      gap: 2rem;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .detail-hero img {
      width: 250px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .detail-hero-info { flex: 1; }
    .detail-hero-info h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .detail-hero-info h2 { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 1rem; }

    .detail-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--bg-hover);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .next-chapter {
      background: var(--primary);
      padding: 0.8rem 1rem;
      border-radius: var(--radius-sm);
      margin: 1rem 0;
      display: inline-block;
    }

    .read-btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 0.8rem 2rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s;
    }

    .read-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.02);
    }

    .detail-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .info-card {
      background: var(--bg-card);
      padding: 1rem;
      border-radius: var(--radius);
    }

    .info-card h3 { color: var(--primary); margin-bottom: 0.8rem; }
    .info-card p { margin: 0.5rem 0; line-height: 1.4; }
    .genres-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .genre-tag {
      background: var(--primary);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
    }

    .synopsis-container {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .synopsis-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .synopsis-tab {
      padding: 0.5rem 1.2rem;
      background: var(--bg-hover);
      border: none;
      border-radius: 30px;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }

    .synopsis-tab.active { background: var(--primary); }
    .synopsis-content { line-height: 1.6; color: var(--text-muted); }

    .chapters-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .chapters-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .chapters-header h3 { font-size: 1.3rem; }
    .chapter-search {
      padding: 0.5rem 1rem;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: var(--text-light);
      width: 200px;
    }

    .chapter-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.8rem;
      max-height: 400px;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .chapter-item {
      background: var(--bg-hover);
      padding: 0.6rem;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chapter-item:hover {
      background: var(--primary);
      transform: translateY(-2px);
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .page-btn {
      padding: 0.4rem 0.8rem;
      background: var(--bg-hover);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }

    .page-btn.active, .page-btn:hover { background: var(--primary); }

    .favorite-btn {
      background: none;
      border: 2px solid var(--primary);
      border-radius: 40px;
      padding: 0.5rem 1rem;
      color: var(--primary);
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      margin-top: 1rem;
    }

    .favorite-btn.active {
      background: var(--primary);
      color: white;
    }

    .toast {
      visibility: hidden;
      min-width: 250px;
      background: var(--bg-card);
      color: var(--text-light);
      text-align: center;
      border-radius: 8px;
      padding: 1rem;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border-left: 4px solid var(--primary);
    }

    .toast.show {
      visibility: visible;
      animation: fadeInOut 3s ease;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }

    .loading, .error {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
    .error { color: var(--primary); }

    @media (max-width: 768px) {
      .detail-hero {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .detail-hero img { width: 200px; }
      .detail-stats { justify-content: center; }
      .chapter-list { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
      .detail-container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="index.html" class="home-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H4a2 2 0 0 1-2-2z"/>
        </svg>
        Accueil
      </a>
      <h1>📖 Détail du Manga</h1>
      <div class="tools-bar">
        <button id="themeToggle" class="theme-btn">🌙</button>
      </div>
    </div>
  </header>

  <main class="detail-container">
    <div id="mangaDetailContainer">
      <div class="loading">⏳ Chargement du manga...</div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const mangaId = urlParams.get('id');
    const ANILIST_API = 'https://graphql.anilist.co';
    const PROXY = 'https://corsproxy.io/?url=';

    let currentLang = 'fr';
    let currentPage = 1;
    let itemsPerPage = 30;
    let totalChapters = 0;
    let mangaData = null;
    let isFav = false;

    // Corrections pour les mangas longs
    const LONG_MANGAS = {
      21: 1125,   // One Piece
      1: 700,     // Naruto
      2: 700,     // Naruto Shippuden
      3: 686,     // Bleach
      7: 255,     // Jujutsu Kaisen
      8: 204,     // Demon Slayer
      9: 398,     // My Hero Academia
      10: 80      // Boruto
    };

    // ============================================
    // REQUÊTE ANILIST
    // ============================================
    const MANGA_QUERY = `
      query ($id: Int) {
        Media(id: $id, type: MANGA) {
          id
          title { romaji english native }
          coverImage { extraLarge large medium }
          description
          descriptionEn: description(asHtml: false, locale: "en")
          descriptionEs: description(asHtml: false, locale: "es")
          descriptionAr: description(asHtml: false, locale: "ar")
          descriptionZh: description(asHtml: false, locale: "zh")
          averageScore
          popularity
          favourites
          status
          chapters
          volumes
          format
          source
          startDate { year month day }
          endDate { year month day }
          authors { nodes { name } }
          genres
          tags { name }
        }
      }
    `;

    async function fetchAnilist(query, variables) {
      try {
        const response = await fetch(PROXY + encodeURIComponent(ANILIST_API), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables })
        });
        const data = await response.json();
        if (data.errors) { console.error('GraphQL Errors:', data.errors); return null; }
        return data.data;
      } catch (error) { console.error('Erreur:', error); return null; }
    }

    async function fetchMangaDetail(id) {
      const data = await fetchAnilist(MANGA_QUERY, { id });
      return data?.Media || null;
    }

    // ============================================
    // GESTION DES FAVORIS
    // ============================================
    function getFavoritesFromStorage() {
      const stored = localStorage.getItem('manga_favorites');
      return stored ? JSON.parse(stored) : [];
    }

    function saveFavoritesToStorage(favorites) {
      localStorage.setItem('manga_favorites', JSON.stringify(favorites));
    }

    async function addToFavorites(id, title, image, score) {
      if (!currentUser) { showToast('🔐 Connectez-vous', 'error'); return false; }
      const favorites = getFavoritesFromStorage();
      if (favorites.some(f => f.id === id)) { showToast('❌ Déjà dans vos favoris'); return false; }
      favorites.push({ id, title, image, score, dateAdded: new Date().toISOString() });
      saveFavoritesToStorage(favorites);
      if (db && currentUser) {
        try { await db.collection('users').doc(currentUser.uid).set({ mangaFavorites: favorites }, { merge: true }); } catch(e) {}
      }
      showToast(`❤️ ${title} ajouté aux favoris`);
      return true;
    }

    async function removeFromFavorites(id) {
      if (!currentUser) return false;
      let favorites = getFavoritesFromStorage();
      const removed = favorites.find(f => f.id == id);
      favorites = favorites.filter(f => f.id != id);
      saveFavoritesToStorage(favorites);
      if (db && currentUser) {
        try { await db.collection('users').doc(currentUser.uid).set({ mangaFavorites: favorites }, { merge: true }); } catch(e) {}
      }
      if (removed) showToast(`🗑️ ${removed.title} retiré des favoris`);
      return true;
    }

    async function isInFavorites(id) {
      const favorites = getFavoritesFromStorage();
      return favorites.some(f => f.id == id);
    }

    // ============================================
    // AFFICHAGE
    // ============================================
    function formatDate(year, month, day) {
      if (!year) return 'Inconnue';
      return new Date(year, month - 1, day || 1).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function getStatusText(status) {
      const map = { FINISHED: '✅ Terminé', RELEASING: '🟢 En cours', NOT_YET_RELEASED: '📅 À venir', CANCELLED: '❌ Annulé' };
      return map[status] || status;
    }

    function cleanHtml(html) {
      if (!html) return '';
      return html.replace(/<br>/g, '\n').replace(/<[^>]*>/g, '').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
    }

    function getDescription(lang) {
      if (!mangaData) return '';
      const descMap = {
        fr: mangaData.description,
        en: mangaData.descriptionEn,
        es: mangaData.descriptionEs,
        ar: mangaData.descriptionAr,
        zh: mangaData.descriptionZh
      };
      return cleanHtml(descMap[lang] || mangaData.description);
    }

    // ============================================
    // PAGINATION CHAPITRES
    // ============================================
    let currentChapterPage = 1;
    let totalChapterPages = 1;

    function renderChapterList(chapters, start, end) {
      return chapters.slice(start, end).map(ch => `<div class="chapter-item" data-chapter="${ch}">Ch. ${ch}</div>`).join('');
    }

    function setupChapterPagination(total) {
      totalChapterPages = Math.ceil(total / itemsPerPage);
      currentChapterPage = 1;
      
      function renderPage(page) {
        const start = (page - 1) * itemsPerPage;
        const end = Math.min(start + itemsPerPage, total);
        const chapters = Array.from({ length: total }, (_, i) => i + 1);
        const chapterList = document.getElementById('chapterList');
        if (chapterList) {
          chapterList.innerHTML = renderChapterList(chapters, start, end);
          document.querySelectorAll('.chapter-item').forEach(item => {
            item.addEventListener('click', () => {
              window.location.href = `manga-reader.html?id=${mangaId}&chapter=${item.dataset.chapter}`;
            });
          });
        }
        updatePagination(page, totalChapterPages);
      }

      function updatePagination(current, total) {
        const paginationDiv = document.getElementById('chapterPagination');
        if (!paginationDiv) return;
        let pages = [];
        for (let i = Math.max(1, current - 2); i <= Math.min(total, current + 2); i++) pages.push(i);
        paginationDiv.innerHTML = `<button class="page-btn" data-page="${current-1}" ${current===1 ? 'disabled' : ''}>◀</button>${pages.map(p => `<button class="page-btn ${p===current?'active':''}" data-page="${p}">${p}</button>`).join('')}<button class="page-btn" data-page="${current+1}" ${current===total ? 'disabled' : ''}>▶</button>`;
        document.querySelectorAll('.page-btn').forEach(btn => {
          if (!btn.disabled) btn.addEventListener('click', () => { const newPage = parseInt(btn.dataset.page); if (!isNaN(newPage)) { currentChapterPage = newPage; renderPage(currentChapterPage); } });
        });
      }
      renderPage(1);
    }

    function setupChapterSearch() {
      document.getElementById('chapterSearch')?.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.chapter-item').forEach(item => {
          item.style.display = item.dataset.chapter.includes(term) ? 'flex' : 'none';
        });
      });
    }

    // ============================================
    // AFFICHAGE PRINCIPAL
    // ============================================
    async function displayMangaDetail(manga) {
      const container = document.getElementById('mangaDetailContainer');
      
      let chapterCount = LONG_MANGAS[mangaId] || manga.chapters || 100;
      const isOngoing = manga.status === 'RELEASING';
      const startDate = formatDate(manga.startDate?.year, manga.startDate?.month, manga.startDate?.day);

      container.innerHTML = `
        <div class="detail-hero">
          <img src="${manga.coverImage?.extraLarge || manga.coverImage?.large || manga.coverImage?.medium}" alt="${manga.title?.romaji}" onerror="this.src='https://via.placeholder.com/250x350?text=No+Image'">
          <div class="detail-hero-info">
            <h1>${manga.title?.romaji || manga.title?.english || 'Sans titre'}</h1>
            <h2>${manga.title?.english || manga.title?.native || ''}</h2>
            <div class="detail-stats">
              <span class="stat">⭐ ${(manga.averageScore / 10).toFixed(1) || 'N/A'}</span>
              <span class="stat">📊 Popularité #${manga.popularity?.toLocaleString() || 'N/A'}</span>
              <span class="stat">❤️ ${manga.favourites?.toLocaleString() || '0'} favoris</span>
              <span class="stat">📚 ${chapterCount} chapitres</span>
            </div>
            <div class="next-chapter">${isOngoing ? '📖 En cours de parution' : '✅ Manga terminé'}</div>
            <div>
              <button id="favoriteBtn" class="favorite-btn ${isFav ? 'active' : ''}">${isFav ? '❤️ Dans mes favoris' : '🤍 Ajouter aux favoris'}</button>
              <a href="#" id="readFirstBtn" class="read-btn">📖 Lire le chapitre 1</a>
            </div>
          </div>
        </div>
        <div class="detail-info-grid">
          <div class="info-card">
            <h3>📅 Informations</h3>
            <p><strong>Statut:</strong> ${getStatusText(manga.status)}</p>
            <p><strong>Chapitres:</strong> ${chapterCount}</p>
            <p><strong>Volumes:</strong> ${manga.volumes || 'N/A'}</p>
            <p><strong>Format:</strong> ${manga.format || 'Manga'}</p>
            <p><strong>Source:</strong> ${manga.source || 'N/A'}</p>
            <p><strong>Date début:</strong> ${startDate}</p>
          </div>
          <div class="info-card">
            <h3>🏷️ Genres</h3>
            <div class="genres-list">${manga.genres?.map(g => `<span class="genre-tag">${g}</span>`).join('') || 'Aucun genre'}</div>
            ${manga.tags?.length ? `<h3 style="margin-top:1rem;">🏷️ Tags</h3><div class="genres-list">${manga.tags.slice(0,8).map(t => `<span class="genre-tag">${t.name}</span>`).join('')}</div>` : ''}
          </div>
          <div class="info-card">
            <h3>📝 Auteurs</h3>
            <p><strong>Auteur(s):</strong> ${manga.authors?.nodes?.map(a => a.name).join(', ') || 'N/A'}</p>
          </div>
        </div>
        <div class="synopsis-container">
          <div class="synopsis-tabs">
            <button class="synopsis-tab ${currentLang === 'fr' ? 'active' : ''}" data-lang="fr">🇫🇷 Français</button>
            <button class="synopsis-tab ${currentLang === 'en' ? 'active' : ''}" data-lang="en">🇬🇧 English</button>
            <button class="synopsis-tab ${currentLang === 'es' ? 'active' : ''}" data-lang="es">🇪🇸 Español</button>
            <button class="synopsis-tab ${currentLang === 'ar' ? 'active' : ''}" data-lang="ar">🇸🇦 العربية</button>
            <button class="synopsis-tab ${currentLang === 'zh' ? 'active' : ''}" data-lang="zh">🇨🇳 中文</button>
          </div>
          <div id="synopsisContent" class="synopsis-content">${getDescription('fr')}</div>
        </div>
        <div class="chapters-section">
          <div class="chapters-header">
            <h3>📚 Liste des chapitres (${chapterCount})</h3>
            <input type="text" id="chapterSearch" class="chapter-search" placeholder="🔍 Rechercher un chapitre...">
          </div>
          <div id="chapterList" class="chapter-list"></div>
          <div id="chapterPagination" class="pagination"></div>
        </div>
      `;

      // Synopsis multilingue
      document.querySelectorAll('.synopsis-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          currentLang = tab.dataset.lang;
          document.querySelectorAll('.synopsis-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('synopsisContent').textContent = getDescription(currentLang) || (currentLang === 'fr' ? 'Synopsis non disponible.' : 'Synopsis not available.');
        });
      });

      // Chapitres
      if (chapterCount > 0) {
        setupChapterPagination(chapterCount);
        setupChapterSearch();
      } else {
        document.getElementById('chapterList').innerHTML = '<div class="loading">Nombre de chapitres non disponible</div>';
      }

      // Premier chapitre
      document.getElementById('readFirstBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = `manga-reader.html?id=${mangaId}&chapter=1`;
      });

      // Favoris
      const favBtn = document.getElementById('favoriteBtn');
      if (favBtn) {
        favBtn.addEventListener('click', async () => {
          if (!currentUser) { showToast('🔐 Connectez-vous', 'error'); return; }
          if (isFav) {
            await removeFromFavorites(manga.id);
            isFav = false;
            favBtn.textContent = '🤍 Ajouter aux favoris';
            favBtn.classList.remove('active');
          } else {
            await addToFavorites(manga.id, manga.title?.romaji, manga.coverImage?.medium, (manga.averageScore / 10).toFixed(1));
            isFav = true;
            favBtn.textContent = '❤️ Dans mes favoris';
            favBtn.classList.add('active');
          }
        });
      }
    }

    async function loadMangaDetail() {
      if (!mangaId) {
        document.getElementById('mangaDetailContainer').innerHTML = '<div class="error">❌ ID manquant</div>';
        return;
      }
      const manga = await fetchMangaDetail(parseInt(mangaId));
      if (manga) {
        isFav = await isInFavorites(mangaId);
        mangaData = manga;
        await displayMangaDetail(manga);
      } else {
        document.getElementById('mangaDetailContainer').innerHTML = '<div class="error">❌ Erreur de chargement</div>';
      }
    }

    // ============================================
    // THEME
    // ============================================
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') document.body.classList.add('light-theme');
      const themeBtn = document.getElementById('themeToggle');
      if (themeBtn) themeBtn.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      const themeBtn = document.getElementById('themeToggle');
      if (themeBtn) themeBtn.textContent = isLight ? '☀️' : '🌙';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
      loadMangaDetail();
    });
  </script>
</body>
</html>
